<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>POWCHAIN — Explorer Neon</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --bg:#050018;
      --accent:#ffb100;
      --accent-soft:#ffd86b;
      --accent-blue:#5ad4ff;
      --accent-pink:#ff3f7f;
      --card:#050822;
      --card-border:#243b64;
      --text-main:#e8f3ff;
      --text-soft:#9fb4ff;
      --grid:#151a3a;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:"Rajdhani",system-ui,-apple-system,Segoe UI,sans-serif;
      background:radial-gradient(circle at 50% -10%,#24145f 0,#050018 55%,#000 100%);
      color:var(--text-main);
      overflow:hidden;
    }
    /* fond animé façon image */
    body::before,body::after{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:-2;
    }
    body::before{
      background:
        radial-gradient(circle at 50% 15%,rgba(255,177,0,.35),transparent 55%),
        radial-gradient(circle at 15% 80%,rgba(90,212,255,.25),transparent 55%),
        radial-gradient(circle at 85% 75%,rgba(255,63,127,.25),transparent 55%);
      mix-blend-mode:screen;
      animation:pulseGlow 10s ease-in-out infinite alternate;
    }
    body::after{
      background:
        linear-gradient(110deg,transparent 0,transparent 35%,rgba(255,63,127,.35) 45%,transparent 55%,transparent 100%),
        linear-gradient(250deg,transparent 0,transparent 40%,rgba(90,212,255,.45) 52%,transparent 63%,transparent 100%);
      opacity:.5;
      animation:lightSweep 12s linear infinite;
    }
    @keyframes pulseGlow{
      0%{transform:translateY(0) scale(1);}
      100%{transform:translateY(-10px) scale(1.05);}
    }
    @keyframes lightSweep{
      0%{background-position:-40vw 0,60vw 0;}
      100%{background-position:40vw 0,-60vw 0;}
    }

    #shell{
      position:relative;
      height:100%;
      display:flex;
      flex-direction:column;
      padding:14px 18px 18px;
      backdrop-filter:blur(10px);
    }
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px;
    }
    #brand{
      display:flex;
      align-items:center;
      gap:10px;
    }
    #brandCircle{
      width:40px;height:40px;
      border-radius:999px;
      background:radial-gradient(circle at 30% 20%,#fff, var(--accent-blue));
      box-shadow:0 0 24px rgba(90,212,255,.9),0 0 50px rgba(255,177,0,.4);
      position:relative;
      overflow:hidden;
    }
    #brandCircle::after{
      content:"";
      position:absolute;
      inset:20%;
      border-radius:50%;
      border:2px solid rgba(5,5,30,.7);
      box-shadow:0 0 18px rgba(255,177,0,.8);
    }
    h1{
      font-size:20px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:var(--accent-soft);
      text-shadow:0 0 10px rgba(255,177,0,.85);
    }
    #brand small{
      display:block;
      font-size:11px;
      text-transform:uppercase;
      color:var(--text-soft);
      opacity:.8;
      margin-top:-3px;
    }

    .pill-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
      justify-content:flex-end;
      font-size:12px;
    }
    .pill{
      padding:4px 10px;
      border-radius:999px;
      border:1px solid rgba(135,206,255,.45);
      background:linear-gradient(135deg,rgba(12,25,60,.85),rgba(20,35,80,.8));
      box-shadow:0 0 14px rgba(0,0,0,.6);
      display:flex;
      align-items:center;
      gap:6px;
      color:var(--text-soft);
    }
    button{
      border-radius:999px;
      border:1px solid var(--accent-soft);
      background:radial-gradient(circle at 30% 0,var(--accent-soft),var(--accent));
      color:#101018;
      font-family:inherit;
      font-weight:600;
      padding:6px 16px;
      font-size:13px;
      cursor:pointer;
      box-shadow:0 0 18px rgba(255,177,0,.7);
      transition:transform .1s ease,box-shadow .1s ease;
    }
    button:hover{transform:translateY(-1px);box-shadow:0 0 22px rgba(255,177,0,.9);}
    button:active{transform:translateY(0);box-shadow:0 0 10px rgba(255,177,0,.5);}

    /* Layout */
    #layout{
      display:flex;
      flex:1;
      gap:12px;
      min-height:0;
    }
    #colLeft,#colRight{
      flex:1;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-width:0;
    }

    .card{
      position:relative;
      background:radial-gradient(circle at 0 0,rgba(255,255,255,.08),transparent 55%),
                 radial-gradient(circle at 100% 100%,rgba(90,212,255,.12),transparent 55%),
                 linear-gradient(145deg,rgba(4,8,32,.96),rgba(5,10,40,.98));
      border-radius:14px;
      border:1px solid var(--card-border);
      box-shadow:0 0 30px rgba(0,0,0,.75);
      padding:10px 12px;
      overflow:hidden;
    }
    .card::before{
      content:"";
      position:absolute;
      inset:-120%;
      background:repeating-linear-gradient(
        115deg,
        rgba(135,206,255,.1) 0,
        rgba(135,206,255,.1) 1px,
        transparent 1px,
        transparent 6px
      );
      opacity:.15;
      mix-blend-mode:screen;
      animation:gridDrift 24s linear infinite;
    }
    @keyframes gridDrift{
      0%{transform:translate3d(0,0,0);}
      100%{transform:translate3d(80px,60px,0);}
    }
    .card> *{position:relative;z-index:1;}

    .card h2{
      font-size:14px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:var(--accent-blue);
      margin-bottom:4px;
    }
    .card h3{
      font-size:13px;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--accent-soft);
      margin-bottom:6px;
    }
    .meta-row{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
      gap:4px 10px;
      font-size:12px;
      color:var(--text-soft);
    }
    .meta-row span.label{opacity:.7;}
    .meta-row span.value{color:var(--accent-blue);}

    #chartWrap{
      height:55%;
      min-height:220px;
    }
    #powChart{
      width:100%;
      height:100%;
    }
    #logWrap{
      flex:1;
      display:flex;
      flex-direction:column;
      min-height:140px;
    }
    #log{
      flex:1;
      margin-top:4px;
      padding:8px;
      font-family:ui-monospace,Menlo,Consolas,monospace;
      font-size:11px;
      background:radial-gradient(circle at 0 0,#05061a,#020310);
      border-radius:10px;
      border:1px solid #1f2544;
      color:#dfe7ff;
      overflow-y:auto;
      white-space:pre-wrap;
    }
    #log strong{color:var(--accent-soft);}

    #phantomStatus,#solanaAddr,#solanaBalance{
      font-size:11px;
      color:var(--text-soft);
      margin-top:2px;
    }
    #solanaBalance{color:var(--accent-blue);}
    #explorerBlock{
      font-size:12px;
      margin-top:4px;
      color:var(--text-soft);
    }
    #explorerBlock div{margin-bottom:2px;}

    @media(max-width:900px){
      #layout{flex-direction:column;}
    }
  </style>
</head>
<body>
<div id="shell">
  <header>
    <div id="brand">
      <div id="brandCircle"></div>
      <div>
        <h1>POWCHAIN EXPLORER</h1>
        <small>Supply • LP • Prix • Blocs temps réel</small>
      </div>
    </div>
    <div class="pill-row">
      <div class="pill">
        <span>Solde</span>
        <span id="solanaBalance">SOL : - | USDC : -</span>
      </div>
      <button onclick="connectPhantom()">Connect Phantom</button>
    </div>
  </header>

  <main id="layout">
    <!-- Colonne gauche : infos bloc / Phantom -->
    <section id="colLeft">
      <div class="card">
        <h2>État réseau POWCHAIN</h2>
        <div class="meta-row">
          <div><span class="label">Hauteur bloc</span><br><span class="value" id="bHeight">-</span></div>
          <div><span class="label">Producteur</span><br><span class="value" id="bProducer">-</span></div>
          <div><span class="label">Supply POW</span><br><span class="value" id="bSupplyPow">-</span></div>
          <div><span class="label">Supply LP POW</span><br><span class="value" id="bSupplyLp">-</span></div>
          <div><span class="label">Prix POW (USDC)</span><br><span class="value" id="bPrice">-</span></div>
          <div><span class="label">Mempool</span><br><span class="value" id="bMempool">-</span></div>
        </div>
        <div id="explorerBlock">
          <div id="phantomStatus">Phantom non connecté</div>
          <div id="solanaAddr">Adresse Solana : -</div>
        </div>
      </div>

      <div class="card" id="logWrap">
        <h3>Console temps réel</h3>
        <div id="log"></div>
      </div>
    </section>

    <!-- Colonne droite : graphique -->
    <section id="colRight">
      <div class="card" id="chartWrap">
        <h3>Évolution — Supply / LP / Prix</h3>
        <canvas id="powChart"></canvas>
      </div>
    </section>
  </main>
</div>

<script>
/* === util console HUD === */
const logBox=document.getElementById("log");
function log(msg){
  const ts=new Date().toLocaleTimeString();
  logBox.textContent+="["+ts+"] "+msg+"\n";
  logBox.scrollTop=logBox.scrollHeight;
}

/* === Phantom (SOL + USDC EPJ) === */
const SOL_RPC="https://lb.drpc.live/solana/Ah_pmhKMs0qntHMrHyHMTvqg8lcNcRkR8LWNEklbR4ac";
const USDC_MINT=new solanaWeb3.PublicKey("EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1");
let solConnection=new solanaWeb3.Connection(SOL_RPC,"confirmed");
let solPubKey=null;

async function connectPhantom(){
  if(!window.solana||!window.solana.isPhantom){log("⚠ Phantom non détecté");return;}
  try{
    const resp=await window.solana.connect();
    solPubKey=resp.publicKey;
    document.getElementById("phantomStatus").textContent="Phantom connecté ✅";
    document.getElementById("solanaAddr").textContent="Adresse Solana : "+solPubKey.toBase58();
    await refreshSolanaBalances();
  }catch(e){log("⚠ Erreur Phantom : "+e.message);}
}
async function refreshSolanaBalances(){
  if(!solPubKey){return;}
  try{
    const lamports=await solConnection.getBalance(solPubKey);
    const sol=lamports/solanaWeb3.LAMPORTS_PER_SOL;
    const res=await solConnection.getParsedTokenAccountsByOwner(solPubKey,{mint:USDC_MINT});
    let usdc=0;
    for(const a of res.value){
      const t=a.account.data.parsed.info.tokenAmount;
      usdc+=Number(t.amount)/Math.pow(10,t.decimals);
    }
    document.getElementById("solanaBalance").textContent=
      "SOL : "+sol.toFixed(4)+" | USDC : "+usdc.toFixed(2);
  }catch(e){log("⚠ Erreur soldes Solana : "+e.message);}
}

/* === Graphique Chart.js (Supply/LP/Prix) === */
const ctx=document.getElementById("powChart");
const chartData={
  labels:[],
  datasets:[
    {label:"Supply POW",data:[],borderColor:"#5ad4ff",backgroundColor:"rgba(90,212,255,.2)",tension:.25},
    {label:"Supply LP POW",data:[],borderColor:"#ffd86b",backgroundColor:"rgba(255,216,107,.15)",tension:.25},
    {label:"Prix POW (USDC)",data:[],borderColor:"#ff3f7f",backgroundColor:"rgba(255,63,127,.18)",yAxisID:"y1",tension:.25}
  ]
};
const powChart=new Chart(ctx,{
  type:"line",
  data:chartData,
  options:{
    responsive:true,
    maintainAspectRatio:false,
    interaction:{mode:"index",intersect:false},
    animation:{duration:700,easing:"easeOutCubic"},
    scales:{
      x:{ticks:{color:"#9fb4ff",font:{size:10}},grid:{color:"rgba(40,60,120,.4)"}},
      y:{position:"left",ticks:{color:"#5ad4ff"},grid:{color:"rgba(20,40,90,.4)"}},
      y1:{position:"right",ticks:{color:"#ff3f7f"},grid:{drawOnChartArea:false}}
    },
    plugins:{
      legend:{labels:{color:"#e8f3ff",font:{size:10}}},
      tooltip:{backgroundColor:"#050822",borderColor:"#243b64",borderWidth:1}
    }
  }
});
function pushExplorerPoint(d){
  const lbl=new Date(d.timestamp).toLocaleTimeString();
  chartData.labels.push(lbl);
  chartData.datasets[0].data.push(d.supplyPow);
  chartData.datasets[1].data.push(d.supplyLpPow);
  chartData.datasets[2].data.push(d.pricePow);
  const maxPoints=40;
  if(chartData.labels.length>maxPoints){
    chartData.labels.shift();
    chartData.datasets.forEach(ds=>ds.data.shift());
  }
  powChart.update();
}

/* === Explorer DOM === */
function updateExplorer(d){
  document.getElementById("bHeight").textContent=d.height;
  document.getElementById("bProducer").textContent=d.producer;
  document.getElementById("bSupplyPow").textContent=d.supplyPow;
  document.getElementById("bSupplyLp").textContent=d.supplyLpPow;
  document.getElementById("bPrice").textContent=d.pricePow.toFixed(6);
  document.getElementById("bMempool").textContent=d.mempool.length;
  pushExplorerPoint(d);
}

/* === WebSocket POWCHAIN === */
let ws=null, wsTimer=null;
function connectWS(){
  const proto=location.protocol==="https:"?"wss":"ws";
  const url=proto+"://"+location.host+"/ws";
  ws=new WebSocket(url);
  ws.onopen=()=>{
    log("✅ WS POWCHAIN connecté : "+url);
    ws.send(JSON.stringify({type:"explorer"}));
  };
  ws.onmessage=ev=>{
    try{
      const msg=JSON.parse(ev.data);
      if(msg.type==="info") log(msg.msg);
      if(msg.type==="explorer"&&msg.data) updateExplorer(msg.data);
    }catch(e){log("⚠ WS message invalide");}
  };
  ws.onclose=()=>{
    log("⚠ WS fermé, reconnexion dans 3s...");
    clearTimeout(wsTimer);
    wsTimer=setTimeout(connectWS,3000);
  };
  ws.onerror=()=>log("⚠ Erreur WS");
}
connectWS();
</script>
</body>
</html>
