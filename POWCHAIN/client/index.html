<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>POWCHAIN — Neon Inferno Edition</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#09090d;
  --card:#0f0f14;
  --card-border:#2b2b33;
  --txt:#e0e0e0;
  --txt-soft:#9a9a9a;

  --red:#ff2b2b;
  --red-glow:#d50d3b;
  --gray:#5d5d67;
  --ice:#9be8ff;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:radial-gradient(circle at 50% 0%,#2b0a0a 0,#09090d 60%,#000 100%);
  font-family:"Rajdhani",sans-serif;
  color:var(--txt);
  overflow:hidden;
}
#shell{
  display:flex;
  flex-direction:column;
  height:100%;
  padding:14px 16px;
}

/* header */
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}
#brand h1{
  font-size:22px;
  letter-spacing:.14em;
  color:var(--red);
  text-shadow:0 0 12px var(--red);
}
#brand small{
  display:block;
  font-size:11px;
  color:var(--gray);
  margin-top:-4px;
}

/* onglets */
#tabs{
  display:flex;
  gap:8px;
  margin-bottom:8px;
}
.tabBtn{
  border:none;
  cursor:pointer;
  padding:6px 16px;
  border-radius:999px;
  background:#1a1a1f;
  color:var(--gray);
  font-family:inherit;
  font-size:12px;
  letter-spacing:.12em;
  transition:.15s;
  border:1px solid var(--gray);
}
.tabBtn.active{
  background:radial-gradient(circle at 30% 0,var(--red),var(--red-glow));
  border-color:var(--red);
  color:#151518;
  box-shadow:0 0 16px rgba(255,0,0,.6);
  transform:translateY(-1px);
}

/* layout explorer */
#layout{
  display:flex;
  gap:10px;
  flex:1;
  min-height:0;
}
#colLeft,#colRight{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:10px;
  min-width:0;
}

/* cards */
.card{
  background:radial-gradient(circle at 0 0,rgba(255,0,0,.08),transparent 50%),
              linear-gradient(160deg,#0b0b0f,#15151b);
  border:1px solid var(--card-border);
  border-radius:12px;
  padding:10px 12px;
  position:relative;
  overflow:hidden;
}
.card::before{
  content:"";
  position:absolute;
  inset:-160%;
  background:repeating-linear-gradient(115deg,rgba(255,0,0,.08) 0,rgba(255,0,0,.08) 2px,transparent 2px,transparent 8px);
  opacity:.25;
  animation:gridDrift 26s linear infinite;
}
@keyframes gridDrift{0%{transform:translate3d(0,0,0);}100%{transform:translate3d(120px,60px,0);}}
.card>*{position:relative;z-index:1;}

.card h2,.card h3{
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:13px;
  margin-bottom:4px;
  color:var(--red);
}

/* meta explorer */
.meta-row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:4px 10px;
  font-size:12px;
  color:var(--txt-soft);
}
.meta-row span.value{
  color:var(--ice);
}

/* graph */
#chartWrap{height:55%;min-height:220px;}
#powChart{width:100%;height:100%}

/* console */
#logWrap{flex:1}
#log{
  flex:1;
  margin-top:4px;
  background:#0a0a0e;
  border-radius:10px;
  border:1px solid var(--card-border);
  font-size:11px;
  font-family:ui-monospace,monospace;
  color:#eaeaea;
  padding:7px;
  overflow-y:auto;
  white-space:pre-wrap;
}

/* zones wallet + bridge */
#walletView,#bridgeView{
  flex:1;
  display:none;
  background:#0a0a0e;
  border-radius:10px;
  border:1px solid var(--card-border);
  padding:10px 12px;
  overflow-y:auto;
  font-size:13px;
}

/* boutons */
button{
  cursor:pointer;
  border:none;
  border-radius:999px;
  font-size:12px;
  padding:6px 16px;
  font-family:inherit;
  font-weight:600;
  letter-spacing:.08em;
  transition:.15s;
  background:#202026;
  color:var(--txt);
  border:1px solid var(--gray);
}
button:hover{
  border-color:var(--red);
  color:var(--red);
  transform:translateY(-1px);
}
button:active{transform:translateY(0)}

/* inputs & selects */
input,select{
  background:#14141a;
  border:1px solid #3a3a44;
  border-radius:6px;
  padding:6px;
  color:#eee;
  margin:3px 0 8px;
  width:100%;
}

/* separator */
.sep{
  height:1px;
  background:linear-gradient(90deg,transparent,var(--red),transparent);
  margin:10px 0;
}
</style>
</head>

<body>
<div id="shell">
  <header>
    <div id="brand">
      <h1>POWCHAIN — NEON INFERNO</h1>
      <small>Explorer • Wallet • Bridge</small>
    </div>
    <button id="btnConnectPhantom">Connect Phantom</button>
  </header>

  <div id="tabs">
    <button class="tabBtn active" id="tabExplorer" onclick="showTab('explorer')">EXPLORER</button>
    <button class="tabBtn" id="tabWallet" onclick="showTab('wallet')">WALLET</button>
    <button class="tabBtn" id="tabBridge" onclick="showTab('bridge')">BRIDGE</button>
  </div>

  <!-- === Panneau Explorer (restera visible par défaut) === -->
  <main id="layout">
    <section id="colLeft">
      <div class="card">
        <h2>ÉTAT RÉSEAU</h2>
        <div class="meta-row">
          <div><span>Bloc</span><br><span class="value" id="bHeight">-</span></div>
          <div><span>Producteur</span><br><span class="value" id="bProducer">-</span></div>
          <div><span>Supply POW</span><br><span class="value" id="bSupplyPow">-</span></div>
          <div><span>Supply LP POW</span><br><span class="value" id="bSupplyLp">-</span></div>
          <div><span>Prix POW</span><br><span class="value" id="bPrice">-</span></div>
          <div><span>Mempool</span><br><span class="value" id="bMempool">-</span></div>
        </div>
        <div style="font-size:12px;margin-top:6px">
          SOL / USDC : <span id="solanaBalance">-</span>
        </div>
      </div>

      <div class="card" id="logWrap">
        <h3>CONSOLE TEMPS RÉEL</h3>
        <div id="log"></div>
      </div>
    </section>

    <section id="colRight">
      <div class="card" id="chartWrap">
        <h3>ÉVOLUTION RÉSEAU</h3>
        <canvas id="powChart"></canvas>
      </div>
    </section>
  </main>

  <!-- === panneaux Wallet & Bridge (cachés au début) === -->
  <div id="walletView"></div>
  <div id="bridgeView"></div><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tweetnacl@1.0.3/nacl-fast.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bs58@5.0.0/dist/bs58.min.js"></script>

<script>
/* ===================== LOG ===================== */
const logBox=document.getElementById("log");
function log(m){
  const t=new Date().toLocaleTimeString();
  logBox.textContent+="["+t+"] "+m+"\n";
  logBox.scrollTop=logBox.scrollHeight;
}

/* ===================== ONGLET ===================== */
function showTab(t){
  document.getElementById("layout").style.display = (t==="explorer")?"flex":"none";
  document.getElementById("walletView").style.display = (t==="wallet")?"block":"none";
  document.getElementById("bridgeView").style.display = (t==="bridge")?"block":"none";

  document.querySelectorAll(".tabBtn").forEach(btn => btn.classList.remove("active"));
  document.getElementById("tab"+t.charAt(0).toUpperCase()+t.slice(1)).classList.add("active");
}

/* ===================== SOLANA PHANTOM ===================== */
const RPC="https://lb.drpc.live/solana/Ah_pmhKMs0qntHMrHyHMTvqg8lcNcRkR8LWNEklbR4ac";
const USDC_MINT="EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1";
let solConn=new solanaWeb3.Connection(RPC,"confirmed");
let phantomPk=null;

async function connectPhantom(){
  if(!window.solana||!window.solana.isPhantom){log("⚠ Phantom non détecté");return;}
  try{
    const r=await window.solana.connect();
    phantomPk=r.publicKey;
    document.getElementById("btnConnectPhantom").textContent="Phantom ✓";
    refreshSolanaBalance();
    log("Phantom connecté");
  }catch(e){log("Erreur Phantom "+e.message);}
}
async function refreshSolanaBalance(){
  if(!phantomPk) return;
  try{
    const lam=await solConn.getBalance(phantomPk);
    const sol=lam/solanaWeb3.LAMPORTS_PER_SOL;
    const tok=await solConn.getParsedTokenAccountsByOwner(
      phantomPk,{mint:new solanaWeb3.PublicKey(USDC_MINT)}
    );
    let usdc=0;
    tok.value.forEach(a=>{usdc+=Number(a.account.data.parsed.info.tokenAmount.amount)/1e6});
    document.getElementById("solanaBalance").textContent=`SOL: ${sol.toFixed(4)} | USDC: ${usdc.toFixed(2)}`;
  }catch(e){log("Erreur solde Phantom "+e.message);}
}
document.getElementById("btnConnectPhantom").onclick=connectPhantom;

/* ===================== POWCHAIN WALLET ===================== */
let powAddr=null,powPriv=null;

function walletUI(){
  return `
  <h2>WALLET POWCHAIN</h2>

  <button onclick="makeWallet()">Créer un nouveau wallet</button>
  <div style="margin:8px 0">
    <input id="privIn" placeholder="Clé privée (bs58)">
    <button onclick="loadWallet()">Charger wallet</button>
  </div>
  <div class="sep"></div>
  <div id="wInfo" style="font-size:13px"></div>

  <h3>📌 Transfert POWCHAIN</h3>
  <input id="toUser" placeholder="Adresse destinataire">
  <input id="amtUser" placeholder="Montant">
  <button onclick="sendUser()">Envoyer</button>

  <div class="sep"></div>
  <h3>💰 Swap</h3>
  <select id="swapDir">
    <option value="pow-usdc">POW → USDC POW</option>
    <option value="usdc-pow">USDC POW → POW</option>
  </select>
  <input id="swapAmt" placeholder="Montant">
  <button onclick="swap()">Swap</button>

  <div class="sep"></div>
  <h3>💧 Faucet</h3>
  <button onclick="faucet()">Recevoir 50 POW de test</button>
  `;
}

/* make wallet */
function makeWallet(){
  const k=nacl.sign.keyPair();
  powPriv=bs58.encode(k.secretKey);
  powAddr=bs58.encode(k.publicKey);
  renderWallet();
  log("Wallet généré");
}

/* load wallet */
function loadWallet(){
  try{
    const sec=bs58.decode(document.getElementById("privIn").value.trim());
    const pub=sec.slice(32);
    powPriv=bs58.encode(sec);
    powAddr=bs58.encode(pub);
    renderWallet();
    log("Wallet chargé");
  }catch(e){log("Clé invalide");}
}

function renderWallet(){
  document.getElementById("wInfo").innerHTML =
    `Adresse: <span style="color:#9be8ff">${powAddr}</span><br>
     PrivKey: <span style="color:#ff2b2b">${powPriv}</span>`;
}

/* ===================== Bridge SOL ↔ POWCHAIN ===================== */
function bridgeUI(){
  return `
  <h2>BRIDGE SOL ↔ POWCHAIN</h2>
  <h3>Entrée Solana → POWCHAIN</h3>
  <input id="amtBr" placeholder="Montant SOL">
  <button onclick="bridgeToPow()">Bridge vers POWCHAIN</button>

  <div class="sep"></div>
  <h3>Sortie POWCHAIN → Solana</h3>
  <input id="solOutAddr" placeholder="Adresse Solana">
  <input id="amtOut" placeholder="Montant POW">
  <button onclick="bridgeToSol()">Bridge vers Solana</button>
  `;
}

/* ===================== injection UI panels ===================== */
document.getElementById("walletView").innerHTML = walletUI();
document.getElementById("bridgeView").innerHTML = bridgeUI();

/* ===================== WebSocket ===================== */
let ws=null;
function wsConnect(){
  const p=location.protocol==="https:"?"wss":"ws";
  ws=new WebSocket(p+"://"+location.host+"/ws");

  ws.onopen=()=>log("WS connecté");
  ws.onclose=()=>setTimeout(wsConnect,2000);
  ws.onerror=()=>log("WS erreur");
  ws.onmessage=(ev)=>{
    try{
      const m=JSON.parse(ev.data);
      if(m.type==="info") log(m.msg);
      if(m.type==="explorer") updateExplorer(m.data);
      if(m.type==="balance") refreshWalletBalance(m.data);
    }catch{}
  };
}
wsConnect();

/* ===================== Explorer ===================== */
function updateExplorer(d){
  document.getElementById("bHeight").textContent=d.height;
  document.getElementById("bProducer").textContent=d.producer;
  document.getElementById("bSupplyPow").textContent=d.supplyPow;
  document.getElementById("bSupplyLp").textContent=d.supplyLpPow;
  document.getElementById("bPrice").textContent=d.pricePow.toFixed(6);
  document.getElementById("bMempool").textContent=d.mempool;
  addPoint(d);
}

/* ===================== Graph ===================== */
const chartData={labels:[],datasets:[
  {label:"POW",data:[],borderColor:"#9be8ff",backgroundColor:"rgba(155,232,255,.18)",tension:.25},
  {label:"LP",data:[],borderColor:"#ffb347",backgroundColor:"rgba(255,179,71,.2)",tension:.25},
  {label:"Prix",data:[],borderColor:"#ff2b2b",backgroundColor:"rgba(255,43,43,.2)",yAxisID:"y1",tension:.25},
]};
const chart=new Chart(document.getElementById("powChart"),{
  type:"line",
  data:chartData,
  options:{
    maintainAspectRatio:false,
    interaction:{mode:"index",intersect:false},
    scales:{
      y:{ticks:{color:"#aaa"}},
      y1:{position:"right",ticks:{color:"#ff2b2b"},grid:{drawOnChartArea:false}}
    }
  }
});
function addPoint(d){
  const lbl=new Date().toLocaleTimeString();
  chartData.labels.push(lbl);
  chartData.datasets[0].data.push(d.supplyPow);
  chartData.datasets[1].data.push(d.supplyLpPow);
  chartData.datasets[2].data.push(d.pricePow);
  if(chartData.labels.length>40){
    chartData.labels.shift();
    chartData.datasets.forEach(ds=>ds.data.shift());
  }
  chart.update();
}

/* ===================== POWCHAIN → server.js TX ===================== */
function sendTX(obj){
  if(!ws||ws.readyState!==1){log("WS non prêt");return;}
  if(!powAddr||!powPriv){log("Wallet requis");return;}
  const sec=bs58.decode(powPriv);
  const msg=JSON.stringify(obj);
  const sig=nacl.sign.detached(new TextEncoder().encode(msg),sec);
  ws.send(JSON.stringify({type:"tx",from:powAddr,obj,sig:bs58.encode(sig)}));
  log("TX envoyée "+obj.action);
}

/* transfert */
function sendUser(){
  sendTX({action:"transfer",to:document.getElementById("toUser").value.trim(),amount:Number(document.getElementById("amtUser").value)});
}

/* swap */
function swap(){
  const d=document.getElementById("swapDir").value;
  sendTX({action:"swap",dir:d,amount:Number(document.getElementById("swapAmt").value)});
}

/* faucet */
function faucet(){ sendTX({action:"faucet"}); }

/* bridge */
function bridgeToPow(){
  if(!phantomPk){log("Connect Phantom");return;}
  sendTX({action:"bridge_in",fromSol:phantomPk.toBase58(),amount:Number(document.getElementById("amtBr").value)});
}
function bridgeToSol(){
  sendTX({action:"bridge_out",toSol:document.getElementById("solOutAddr").value.trim(),amount:Number(document.getElementById("amtOut").value)});
}
</script>
</body>
</html>
