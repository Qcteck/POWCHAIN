<!doctype html><html lang="fr"><head><meta charset="utf-8"/><meta name="viewport"content="width=device-width,initial-scale=1"/><title>POWCHAIN — BBQ Dashboard Pro</title><style>body{margin:0;background:#0c0c0e;color:#eee;font-family:Arial;overflow-x:hidden}header{background:#111;border-bottom:2px solid #700;padding:14px;text-align:center;color:#d44;font-size:22px;font-weight:700;letter-spacing:1px}button,input{background:#18181a;border:1px solid #700;color:#eee;padding:9px;border-radius:6px;font-size:15px;margin:4px 0}button:hover{background:#2a2a2c}#wrap{max-width:1100px;margin:auto;padding:10px}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:14px}.card{background:#141416;border:1px solid #550;padding:12px;border-radius:10px;box-shadow:0 0 10px #000}h2{margin:6px 0 10px;color:#d44;font-size:18px;text-align:center;text-shadow:0 0 6px #700}.balance{font-size:17px;margin:6px 0;color:#fff;font-weight:600}#log{white-space:pre-wrap;background:#000;border:1px solid #500;padding:10px;height:210px;overflow:auto;font-size:12px;margin-top:14px;border-radius:8px}.flex{display:flex;gap:8px;align-items:center}.copy{cursor:pointer;color:#d44;font-size:13px}.copy:hover{color:#f66}input{width:100%;box-sizing:border-box}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#700}</style></head><body><header>🔥 POWCHAIN — BBQ Dashboard Pro</header><div id="wrap"><div class="card"><h2>Connexion Phantom</h2><button onclick="connectPhantom()">Connecter Phantom</button><div id="phantomAddr"></div></div><div class="card"><h2>Wallet POWCHAIN</h2><button onclick="gen()">Générer Wallet</button><input id="privImport"placeholder="Importer clé privée"><button onclick="imp()">Importer</button><div id="addrBox"></div></div><div class="card"><h2>Soldes</h2><div class="balance" id="balPow">POW: ?</div><div class="balance" id="balUsdc">USDC POW: ?</div><div class="balance" id="balLp">LP NFT: ?</div><button onclick="refresh()">🔄 Actualiser</button></div><div class="card"><h2>Swap</h2><select id="swapFrom"><option value="pow">POW</option><option value="usdc">USDC POW</option></select><select id="swapTo"><option value="usdc">USDC POW</option><option value="pow">POW</option></select><input id="swapAmt"placeholder="Montant"><button onclick="swap()">Swap</button></div><div class="card"><h2>LP Fournir / Retirer</h2><input id="lpPow"placeholder="POW"><input id="lpUsdc"placeholder="USDC POW"><button onclick="lpAdd()">Ajouter LP</button><input id="lpDel"placeholder="LP NFT"><button onclick="lpRemove()">Retirer LP</button></div><div class="card"><h2>Staking POW</h2><input id="stakeAmt"placeholder="POW à staker"><button onclick="stake()">Staker</button><input id="unstakeAmt"placeholder="POW à unstake"><button onclick="unstake()">Unstake</button></div><div class="card"><h2>Explorer</h2><button onclick="fetchChain()">🔍 Voir la chaîne</button><button onclick="fetchMempool()">🕒 Mempool</button><div id="explorer"></div></div><pre id="log"></pre></div><script>
/*=== CONFIG ===*/
const API="https://bbqfinance.fun:3000"; // API serveur POWCHAIN
const WS ="wss://bbqfinance.fun:7001";
const log=t=>{logBox.textContent+=t+"\n";logBox.scrollTop=logBox.scrollHeight};
let addr=null,priv=null,pub=null,nonce=0,sock=null;

/*=== Connexion Phantom ===*/
async function connectPhantom(){
 try{const p=window.solana;if(!p)return alert("Phantom non détecté");
 const r=await p.connect();document.getElementById("phantomAddr").textContent="Phantom: "+r.publicKey.toString();log("Phantom connecté");}catch(e){log("Erreur Phantom "+e);}
}

/*=== Wallet POWCHAIN ===*/
function b58e(b){return bs58.encode(b);}
function b58d(s){return new Uint8Array(bs58.decode(s));}
function gen(){
 const kp=nacl.sign.keyPair();priv=b58e(kp.secretKey);pub=b58e(kp.publicKey);addr=pub;nonce=0;
 document.getElementById("addrBox").innerHTML="Adresse: "+addr+" <span class='copy' onclick='cp(addr)'>Copier</span><br>Clé Privée: "+priv+" <span class='copy' onclick='cp(priv)'>Copier</span>";
 log("Wallet généré");
}
function imp(){
 try{priv=document.getElementById("privImport").value.trim();if(!priv)return;
 const sk=b58d(priv);pub=b58e(sk.slice(32));addr=pub;nonce=0;
 document.getElementById("addrBox").innerHTML="Adresse: "+addr+" <span class='copy' onclick='cp(addr)'>Copier</span><br>Clé Privée importée";}
 catch{alert("clé invalide")}
}
function cp(t){navigator.clipboard.writeText(t);}

/*=== Requêtes ===*/
async function jget(p){const r=await fetch(API+p);return r.json();}
async function jpost(p,o){
 const msg={from:addr,pub,nonce:nonce+1,...o};
 const j=JSON.stringify({type:p,...o,from:addr,pub,nonce:nonce+1});
 const sig=nacl.sign.detached(new TextEncoder().encode(j),b58d(priv));
 msg.sig=b58e(sig);
 const r=await fetch(API+"/"+p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(msg)});
 const rt=await r.json();if(rt.ok)nonce++;return rt;
}

/*=== Soldes ===*/
async function refresh(){
 const r=await jget("/wallet/"+addr);
 balPow.textContent="POW: "+(r.pow??0);
 balUsdc.textContent="USDC POW: "+(r.usdc??0);
 balLp.textContent="LP NFT: "+(r.lp_nft??0);
}

/*=== Swap ===*/
async function swap(){
 const a=document.getElementById("swapAmt").value;
 const f=swapFrom.value;const t=swapTo.value;
 const r=await jpost("swap",{token1:f,token2:t,amount:+a});log(JSON.stringify(r));
}

/*=== LP ===*/
async function lpAdd(){
 const pa=+lpPow.value,ua=+lpUsdc.value;
 const r=await jpost("lp_add",{pow:pa,usdc:ua});log(JSON.stringify(r));
}
async function lpRemove(){
 const x=document.getElementById("lpDel").value;
 const r=await jpost("lp_del",{lp:+x});log(JSON.stringify(r));
}

/*=== Staking ===*/
async function stake(){log(JSON.stringify(await jpost("stake",{amount:+stakeAmt.value})));}
async function unstake(){log(JSON.stringify(await jpost("unstake",{amount:+unstakeAmt.value})));}
async function fetchChain(){explorer.textContent=JSON.stringify(await jget("/chain")); }
async function fetchMempool(){explorer.textContent=JSON.stringify(await jget("/mempool")); }

/*=== WS Live ===*/
sock=new WebSocket(WS);
sock.onmessage=e=>log("🧱 "+e.data);
sock.onclose=()=>{log("WS fermé - reconnexion");setTimeout(()=>location.reload(),1500);}
</script>
<script src="https://cdn.jsdelivr.net/npm/tweetnacl/nacl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bs58/dist/bs58.min.js"></script>
<script>const logBox=document.getElementById("log")</script></body></html>
