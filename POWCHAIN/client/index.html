<script><!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport"content="width=device-width,initial-scale=1"/>
<title>POWCHAIN — Client v4</title>

<style>
body{margin:0;background:radial-gradient(circle at top,#111827,#020617 55%,#000);color:#dbeafe;font-family:system-ui,sans-serif;overflow-x:hidden}
#app{display:flex;min-height:100vh}
#side{width:220px;background:#020617;border-right:1px solid #1f2937;padding:16px 12px;box-sizing:border-box;display:flex;flex-direction:column}
#logo{display:flex;align-items:center;gap:9px;margin-bottom:20px}
#logoIcon{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#38bdf8,#6366f1,#7c3aed);box-shadow:0 0 18px #4f46e5}
nav a{display:flex;gap:8px;padding:8px;margin:2px 0;color:#9ca3af;text-decoration:none;border-radius:8px;cursor:pointer;font-size:13px}
nav a:hover,nav a.active{background:#0b1120;border:1px solid #1d4ed8;color:#fff}
#main{flex:1;padding:18px;overflow:auto;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.card{padding:12px;border-radius:14px;background:#020617;border:1px solid #111827;box-shadow:0 0 22px #000a}
.card b{font-size:13px;color:#93c5fd}
input,button,select{width:100%;padding:8px;margin-top:4px;border-radius:8px;border:1px solid #1f2937;background:#020617;color:#e5e7eb;font-size:12px}
button{background:linear-gradient(90deg,#1d4ed8,#4f46e5);cursor:pointer;letter-spacing:.1em}
button:hover{filter:brightness(1.12)}
#log{margin-top:18px;border-radius:12px;border:1px solid #1f2937;height:130px;overflow:auto;padding:8px;font-size:10px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="app">

<!-- SIDE -->
<aside id="side">
 <div id="logo"><div id="logoIcon"></div><span style="color:#bfdbfe;font-size:13px;letter-spacing:.16em;font-weight:600">POWCHAIN</span></div>
 <nav>
  <a class="active" data-tab="wallet">Wallet</a>
  <a data-tab="dex">DEX</a>
  <a data-tab="tools">Tools</a>
 </nav>
</aside>

<!-- MAIN -->
<div id="main">
 <div class="grid">

  <!-- WALLET GEN -->
  <div class="card" data-section="wallet">
    <b>Wallet ⋅ Générateur & Connexion</b>
    <input id="addr" placeholder="Adresse POWCHAIN">
    <input id="priv" placeholder="Clé privée">
    <button id="gen">Générer Wallet</button>
    <button id="load">Connecter</button>
    <div style="margin-top:6px;font-size:11px">
      POW <span id="wpow">0</span> — USDC <span id="wusdc">0</span> — Stake <span id="wstk">0</span>
    </div>
  </div>

  <!-- SEND / STAKE -->
  <div class="card" data-section="wallet">
    <b>Actions Wallet</b>
    <input id="to" placeholder="Adresse destinataire">
    <input id="amt" placeholder="Montant POW">
    <button id="send">Envoyer POW</button>
    <input id="stakeAmt" placeholder="Montant POW à staker">
    <button id="stakeBtn">Stake</button>
  </div>

  <!-- DEX SWAP -->
  <div class="card" data-section="dex">
    <b>DEX POWCHAIN</b>
    LP POW <span id="lpPow">0</span> — LP USDC <span id="lpUsdc">0</span><br><br>
    <input id="swapAmt" placeholder="Montant">
    <select id="swapDir">
     <option value="pow2usdc">POW → USDC</option>
     <option value="usdc2pow">USDC → POW</option>
    </select>
    <button id="swap">Swap</button>
  </div>

  <!-- ADD LP -->
  <div class="card" data-section="dex">
    <b>Ajouter de la Liquidité</b>
    <input id="lpPOW" placeholder="POW">
    <input id="lpUSDC" placeholder="USDC POW">
    <button id="addLP">Add LP</button>
  </div>

  <!-- SCAN -->
  <div class="card" data-section="tools">
    <b>Scanner un Wallet</b>
    <input id="scan" placeholder="Adresse">
    <button id="btnScan">SCAN</button>
    <pre id="scanOut"></pre>
  </div>

  <!-- WEBHASH -->
  <div class="card" data-section="tools">
    <b>WebHash ⋅ Bloc</b>
    <input id="bh" placeholder="# bloc">
    <button id="btnHash">Obtenir données bloc</button>
    <pre id="hashOut"></pre>
  </div>

 </div>
 <div id="log"></div>
</div>
</div>

<!-- CRYPTO -->
<script src="https://cdn.jsdelivr.net/npm/tweetnacl/nacl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bs58"></script>

<script>
/* ======== CONFIG ======== */
const API = "http://srv1140401.hstgr.cloud:3000";
const WS  = "ws://srv1140401.hstgr.cloud:7001";
const DEC = 1e6;
let addr=null, priv=null, pub=null, nonce=0, sock=null;

/* ======== LOG ======== */
const log = m => (document.querySelector("#log").textContent = "["+new Date().toLocaleTimeString()+"] "+m+"\n"+document.querySelector("#log").textContent);
const fmt = v => (v / DEC).toFixed(6);

/* ======== WS CONNECT ======== */
function connectWS(){
  sock = new WebSocket(WS);
  sock.onopen  = () => log("WS connecté");
  sock.onclose = () => { log("WS fermé — reconnexion..."); setTimeout(connectWS,1500); };
}
connectWS();

/* ======== API ======== */
const jget = p => fetch(API+p).then(r => r.json());

/* ======== SIGN ======== */
function signTx(payload){
  const msg = new TextEncoder().encode(JSON.stringify(payload));
  const sk = bs58.decode(priv);
  const sig = nacl.sign.detached(msg, sk);
  return bs58.encode(sig);
}

/* ======== WALLET ======== */
document.querySelector("#gen").onclick = () => {
  const kp = nacl.sign.keyPair();
  addr = bs58.encode(kp.publicKey);
  priv = bs58.encode(kp.secretKey);
  pub = addr;
  nonce = 0;
  document.querySelector("#addr").value = addr;
  document.querySelector("#priv").value = priv;
  log("Nouveau wallet généré");
};

document.querySelector("#load").onclick = async () => {
  addr = document.querySelector("#addr").value.trim();
  priv = document.querySelector("#priv").value.trim();
  if(!addr || !priv) return alert("Adresse + clé privée requises");
  const w = await jget("/wallet/"+addr);
  nonce = w.nonce || 0; pub = w.pub || addr;
  document.querySelector("#wpow").textContent = fmt(w.pow||0);
  document.querySelector("#wusdc").textContent = fmt(w.usdc||0);
  document.querySelector("#wstk").textContent = fmt(w.staked||0);
  log("Wallet chargé");
};

/* ======== SEND POW ======== */
document.querySelector("#send").onclick = () => {
  if(!addr) return alert("Connect wallet");
  const p = parseFloat(document.querySelector("#amt").value||"0");
  const to = document.querySelector("#to").value.trim();
  const tx = {type:"TX_POW",from:addr,to,amount:Math.floor(p*DEC),nonce:nonce+1,pub};
  tx.sig = signTx(tx);
  sock.send(JSON.stringify(tx));
  nonce++; log("TX POW envoyée");
};

/* ======== STAKE ======== */
document.querySelector("#stakeBtn").onclick = () => {
  const p = parseFloat(document.querySelector("#stakeAmt").value||"0");
  const tx = {type:"STAKE",addr,from:addr,amount:Math.floor(p*DEC),nonce:nonce+1,pub};
  tx.sig = signTx(tx);
  sock.send(JSON.stringify(tx));
  nonce++; log("Stake envoyé");
};

/* ======== SWAP ======== */
document.querySelector("#swap").onclick = () => {
  const a = parseFloat(document.querySelector("#swapAmt").value||"0");
  const tx = {type:"SWAP",addr,from:addr,amount:Math.floor(a*DEC),token:document.querySelector("#swapDir").value,nonce:nonce+1,pub};
  tx.sig = signTx(tx);
  sock.send(JSON.stringify(tx));
  nonce++; log("Swap envoyé");
};

/* ======== ADD LP ======== */
document.querySelector("#addLP").onclick = () => {
  const p = parseFloat(document.querySelector("#lpPOW").value||"0");
  const u = parseFloat(document.querySelector("#lpUSDC").value||"0");
  const tx = {type:"LP_ADD",addr,from:addr,pow:Math.floor(p*DEC),usdc:Math.floor(u*DEC),nonce:nonce+1,pub};
  tx.sig = signTx(tx);
  sock.send(JSON.stringify(tx));
  nonce++; log("LP ajouté");
};

/* ======== SCAN ======== */
document.querySelector("#btnScan").onclick = async () => {
  const a = document.querySelector("#scan").value.trim();
  const w = await jget("/wallet/"+a);
  document.querySelector("#scanOut").textContent = 
    "POW: "+fmt(w.pow||0)+"\nUSDC: "+fmt(w.usdc||0)+"\nStake: "+fmt(w.staked||0);
  log("Scan wallet OK");
};

/* ======== WEBHASH ======== */
document.querySelector("#btnHash").onclick = async () => {
  const h = parseInt(document.querySelector("#bh").value||"0");
  const b = await jget("/block/"+h);
  document.querySelector("#hashOut").textContent = JSON.stringify(b,null,2);
  log("WebHash bloc #"+h);
};

/* ======== TABS ======== */
document.querySelectorAll("nav a").forEach(x => x.onclick = () => {
  const t = x.getAttribute("data-tab");
  document.querySelectorAll("nav a").forEach(a => a.classList.remove("active"));
  x.classList.add("active");
  document.querySelectorAll("[data-section]").forEach(c => {
    c.style.display = (c.getAttribute("data-section")===t?"block":"none");
  });
});
</script>
</body>
</html>
