<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>POWCHAIN — Quantum Client PRO</title>
<style>
body{margin:0;background:radial-gradient(circle at top,#111827,#020617 60%,#000);
color:#dbeafe;font-family:system-ui,sans-serif;overflow-x:hidden}
#shell{display:flex;min-height:100vh}
#side{width:220px;background:#020617;border-right:1px solid #1f2937;
padding:16px 12px;box-sizing:border-box;display:flex;flex-direction:column}
#logo{display:flex;align-items:center;gap:8px;margin-bottom:18px}
#logoIcon{width:34px;height:34px;border-radius:50%;
background:radial-gradient(circle,#38bdf8,#6366f1,#7c3aed)}
nav a{display:flex;gap:8px;padding:8px 10px;margin:3px 0;font-size:13px;
color:#9ca3af;text-decoration:none;border-radius:9px;cursor:pointer}
nav a:hover,nav a.active{background:#0b1120;color:#fff;border:1px solid #1d4ed8}
#main{flex:1;overflow:auto;padding:18px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{padding:12px;border-radius:14px;background:#020617;
border:1px solid #111827;box-shadow:0 0 22px #000a}
b{color:#fff;font-size:14px}
input,button,select{border-radius:9px;border:1px solid #1f2937;
background:#020617;color:#e5e7eb;padding:7px 8px;font-size:12px;width:100%}
button{cursor:pointer;background:linear-gradient(90deg,#1d4ed8,#4f46e5);
text-transform:uppercase;letter-spacing:.12em;font-size:11px}
button:hover{filter:brightness(1.15)}
#log{margin-top:14px;border-radius:12px;border:1px solid #1f2937;
padding:8px;font-size:11px;height:130px;overflow:auto;white-space:pre}
</style>
</head>
<body>
<div id="shell">

<!-- SIDE -->
<div id="side">
 <div id="logo"><div id="logoIcon"></div><span>POWCHAIN</span></div>
 <nav>
  <a class="active" data-tab="wallet">Wallet</a>
  <a data-tab="dex">DEX</a>
  <a data-tab="tools">Tools</a>
  <a data-tab="bridge">Bridge</a>
 </nav>
</div>

<!-- MAIN -->
<div id="main">
<div class="grid">

<!-- WALLET -->
<div class="card" data-section="wallet">
 <b>Wallet · Générateur</b>
 <input id="addr" placeholder="Adresse POWCHAIN">
 <input id="priv" placeholder="Clé privée" style="margin-top:4px">
 <button id="gen" style="margin-top:6px">Generate</button>
 <button id="load" style="margin-top:4px">Connect Wallet</button>
 <div style="margin-top:6px;font-size:11px">
 POW: <span id="wpow">0</span> — USDC: <span id="wusdc">0</span> — Stake: <span id="wstk">0</span>
 </div>
</div>

<!-- SEND / STAKE -->
<div class="card" data-section="wallet">
 <b>Actions Wallet</b>
 <input id="to" placeholder="Destinataire">
 <input id="amt" placeholder="Montant POW" style="margin-top:4px">
 <button id="send" style="margin-top:6px">Send POW</button>
 <input id="stakeAmt" placeholder="Stake POW" style="margin-top:6px">
 <button id="stakeBtn" style="margin-top:4px">Stake</button>
</div>

<!-- DEX -->
<div class="card" data-section="dex">
 <b>DEX POWCHAIN</b>
 LP POW: <span id="lpPow">0</span> — LP USDC: <span id="lpUsdc">0</span><br><br>
 <input id="swapAmt" placeholder="Montant">
 <select id="swapDir" style="margin-top:4px">
  <option value="pow2usdc">POW → USDC</option>
  <option value="usdc2pow">USDC → POW</option>
 </select>
 <button id="swap" style="margin-top:6px">Swap</button>
</div>

<!-- LP -->
<div class="card" data-section="dex">
 <b>Add Liquidity</b>
 <input id="lpPOW" placeholder="POW">
 <input id="lpUSDC" placeholder="USDC POW" style="margin-top:4px">
 <button id="addLP" style="margin-top:6px">Add LP</button>
</div>

<!-- SCAN -->
<div class="card" data-section="tools">
 <b>Scan Wallet</b>
 <input id="scan" placeholder="Adresse à scanner">
 <button id="btnScan" style="margin-top:6px">SCAN</button>
 <div id="scanOut" style="margin-top:4px;font-size:11px;white-space:pre"></div>
</div>

<!-- WEBHASH -->
<div class="card" data-section="tools">
 <b>WebHash ▪ Bloc</b>
 <input id="bh" placeholder="# du bloc">
 <button id="btnHash" style="margin-top:6px">GET HASH</button>
 <div id="hashOut" style="margin-top:4px;font-size:11px;white-space:pre;max-height:140px;overflow:auto"></div>
</div>

<!-- BRIDGE -->
<div class="card" data-section="bridge">
 <b>Bridge SOL → USDC POW</b>
 <input id="solAmt" placeholder="Montant en SOL">
 <button id="bridge" style="margin-top:6px">Bridge</button>
 <div style="font-size:11px;margin-top:6px;color:#a5f3fc">1 SOL → 1M USDC POW</div>
</div>

</div>
<div id="log"></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/tweetnacl/nacl.min.js"></script>
<script>
/* === CONFIG === */
const API="http://srv1140401.hstgr.cloud:3000";
const WS ="ws://srv1140401.hstgr.cloud:7001";
const DEC=1e6;

/* === SHORTCUT === */
const q=s=>document.querySelector(s);
const log=m=>{q("#log").textContent="["+new Date().toLocaleTimeString()+"] "+m+"\n"+q("#log").textContent;};
const fmt=v=>(v/DEC).toFixed(6);

let addr=null,priv=null,pub=null,nonce=0,sock=null;

/* === BASE58 === */
const ALPH="123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
function b58encode(bytes){let d=[0],r="",c,x;for(let i=0;i<bytes.length;i++){c=bytes[i];for(let j=0;j<d.length;j++){x=d[j]*256+c;d[j]=x%58;c=(x/58)|0}while(c>0){d.push(c%58);c=(c/58)|0}}let z=0;while(z<bytes.length&&bytes[z]===0)z++;for(let i=0;i<z;i++)r+="1";for(let i=d.length-1;i>=0;i--)r+=ALPH[d[i]];return r;}
function b58decode(str){let b=[0];for(let i=0;i<str.length;i++){let c=ALPH.indexOf(str[i]),x;if(c<0)throw Error("base58");for(let j=0;j<b.length;j++){x=b[j]*58+c;b[j]=x&255;c=x>>8}while(c>0){b.push(c&255);c>>=8}}let z=0;while(z<str.length&&str[z]==="1")z++;let r=new Uint8Array(z+b.length);for(let i=0;i<b.length;i++)r[r.length-1-i]=b[i];return r;}

/* === WS === */
function connectWS(){
  sock=new WebSocket(WS);
  sock.onopen = () => log("WS connecté");
  sock.onclose= () => {log("WS fermé, reconnexion...");setTimeout(connectWS,1500);}
}
connectWS();

async function jget(p){const r=await fetch(API+p);return r.json();}

/* === SIGN === */
function signTx(o){
  const payload={type:o.type,from:o.from,to:o.to,amount:o.amount,token:o.token,nonce:o.nonce};
  const msg=new TextEncoder().encode(JSON.stringify(payload));
  const sk=b58decode(priv);
  return b58encode(nacl.sign.detached(msg,sk));
}

/* === GENERATE === */
q("#gen").onclick=()=>{
  const kp=nacl.sign.keyPair();
  addr=b58encode(kp.publicKey);
  priv=b58encode(kp.secretKey);
  pub=addr;nonce=0;
  q("#addr").value=addr;q("#priv").value=priv;
  q("#wpow").textContent="0";q("#wusdc").textContent="0";q("#wstk").textContent="0";
  log("Nouveau wallet généré — sauvegarde la clé privée");
};

/* === LOAD === */
q("#load").onclick=async()=>{
  addr=q("#addr").value.trim();priv=q("#priv").value.trim();
  const w=await jget("/wallet/"+addr);
  nonce=w.nonce||0;pub=w.pub||addr;
  q("#wpow").textContent=fmt(w.pow||0);
  q("#wusdc").textContent=fmt(w.usdc||0);
  q("#wstk").textContent=fmt(w.staked||0);
  log("Wallet chargé");
};

/* === SEND === */
q("#send").onclick=()=>{
  const to=q("#to").value.trim(),a=parseFloat(q("#amt").value||"0");
  const tx={type:"TX_POW",from:addr,to,amount:Math.floor(a*DEC),nonce:nonce+1,pub};
  tx.sig=signTx(tx);
  sock.send(JSON.stringify(tx));nonce++;
  log("TX envoyée");
};

/* === STAKE === */
q("#stakeBtn").onclick=()=>{
  const a=parseFloat(q("#stakeAmt").value||"0");
  const tx={type:"STAKE",from:addr,addr,amount:Math.floor(a*DEC),nonce:nonce+1,pub};
  tx.sig=signTx(tx);sock.send(JSON.stringify(tx));nonce++;
  log("STAKE envoyé");
};

/* === SWAP === */
q("#swap").onclick=()=>{
  const a=parseFloat(q("#swapAmt").value||"0");
  const tx={type:"SWAP",from:addr,addr,amount:Math.floor(a*DEC),token:q("#swapDir").value,nonce:nonce+1,pub};
  tx.sig=signTx(tx);sock.send(JSON.stringify(tx));nonce++;
  log("SWAP envoyé");
};

/* === LP ADD === */
q("#addLP").onclick=()=>{
  const tx={type:"LP_ADD",from:addr,addr,pow:Math.floor(parseFloat(q("#lpPOW").value||"0")*DEC),
            usdc:Math.floor(parseFloat(q("#lpUSDC").value||"0")*DEC),nonce:nonce+1,pub};
  tx.sig=signTx(tx);sock.send(JSON.stringify(tx));nonce++;
  log("LP ajouté");
};

/* === SCAN === */
q("#btnScan").onclick=async()=>{
  const a=q("#scan").value.trim();
  const w=await jget("/wallet/"+a);
  q("#scanOut").textContent=`POW: ${fmt(w.pow)}\nUSDC: ${fmt(w.usdc)}\nStake: ${fmt(w.staked)}`;
  log("Scan ok");
};

/* === WEBHASH === */
q("#btnHash").onclick=async()=>{
  const h=parseInt(q("#bh").value||"0");
  const b=await jget("/block/"+h);
  let o=`HASH: ${b.hash}\nTime: ${new Date(b.time).toLocaleString()}\nTX:\n`;
  b.txs.forEach(t=>{o+=` - ${t.type} ${t.from} → ${t.to||""} ${t.amount?fmt(t.amount):""}\n`;});
  q("#hashOut").textContent=o;
  log("WebHash OK");
};

/* === BRIDGE SOL === */
q("#bridge").onclick=()=>{
  const sol=parseFloat(q("#solAmt").value||"0");
  const tx={type:"BRIDGE_SOL",addr,from:addr,solAmount:sol,nonce:nonce+1,pub};
  tx.sig=signTx(tx);
  sock.send(JSON.stringify(tx));nonce++;
  log("Bridge SOL → USDC POW envoyé");
};

/* === TABS === */
document.querySelectorAll("nav a").forEach(a=>a.onclick=()=>{
  const t=a.getAttribute("data-tab");
  document.querySelectorAll("nav a").forEach(x=>x.classList.remove("active"));
  a.classList.add("active");
  document.querySelectorAll("[data-section]").forEach(c=>{
    c.style.display=(c.getAttribute("data-section")===t)?"block":"none";
  });
});
</script>
</body>
</html>
