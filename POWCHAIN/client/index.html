<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BBQ Finance — POWCHAIN Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Rajdhani:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#020b18;color:#8ff;font-family:'Rajdhani',sans-serif}
h2{margin:0 0 6px;color:#0ff;text-shadow:0 0 6px #09f}
.card{background:#04101c;border:1px solid #09385a;padding:12px;border-radius:10px;box-shadow:0 0 18px #0008;margin-bottom:12px}
.btn{padding:7px 14px;border-radius:6px;border:1px solid #0ff;background:#02202f;color:#8ff;font-size:14px;cursor:pointer}
.btn:hover{background:#044}
input{width:100%;padding:6px;margin:4px 0;border-radius:6px;border:1px solid #0ff;background:#02202f;color:#8ff;font-size:14px}
#log{white-space:pre-wrap;background:#0005;border:1px solid #033;height:240px;overflow:auto;padding:8px;color:#9df;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
</style>
</head>
<body>

<div style="max-width:1100px;margin:20px auto;padding:12px">
<div class="grid">

<div class="card">
<h2>SOLANA — PHANTOM</h2>
Adresse Solana :
<input id="solAddr" readonly>
<button class="btn" onclick="connectPhantom()">CONNECTER PHANTOM</button>
<button class="btn" onclick="refreshBal()">RAFRAÎCHIR SOLDES</button>
<div style="margin-top:8px">SOL : <span id="solBal">-</span></div>
<div>USDC : <span id="usdcBal">-</span></div>
</div>

<div class="card">
<h2>WALLET POWCHAIN</h2>
<button class="btn" onclick="genWallet()">CRÉER UN NOUVEAU WALLET POWCHAIN</button>
Adresse POWCHAIN :
<input id="powAddr" readonly>
<button class="btn" onclick="copy('powAddr')">COPIER ADRESSE</button>
Clé privée :
<input id="powPriv" type="password" readonly>
<button class="btn" onclick="togglePriv()">AFFICHER/MASQUER</button>
<button class="btn" onclick="copy('powPriv')">COPIER CLÉ PRIVÉE</button>
</div>

</div>

<div class="card">
<h2>POWCHAIN LIVE</h2>
<button class="btn" onclick="ping()">PING</button>
<span id="status">hors ligne</span> — Hauteur <span id="h">-</span> — LP POW <span id="lpPow">-</span> — LP USDC <span id="lpUsdc">-</span> — Trésorerie <span id="trez">-</span>
<div id="log"></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/tweetnacl/nacl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bs58@5.0.0/dist/bs58.min.js"></script>

<script>
/* === CONFIG === */
const API="http://72.60.65.18:3000";
const WS="ws://72.60.65.18:3000";
const DEC=1e6;

/* === TOOL === */
const log=t=>{let L=document.querySelector("#log");L.textContent+="["+new Date().toLocaleTimeString()+"] "+t+"\n";L.scrollTop=L.scrollHeight}

/* === POWCHAIN WALLET === */
function genWallet(){
 let kp=nacl.sign.keyPair();
 let pub=bs58.encode(kp.publicKey);
 let priv=bs58.encode(kp.secretKey);
 document.querySelector("#powAddr").value=pub;
 document.querySelector("#powPriv").value=priv;
 log("Wallet POWCHAIN généré");
}
function togglePriv(){
 let p=document.querySelector("#powPriv");
 p.type=p.type==="password"?"text":"password";
}
function copy(id){
 navigator.clipboard.writeText(document.getElementById(id).value);
 log("Copié : "+id);
}

/* === PHANTOM === */
async function connectPhantom(){
 if(!window.solana||!window.solana.isPhantom){log("Phantom introuvable");return;}
 const resp=await window.solana.connect();
 document.getElementById("solAddr").value=resp.publicKey.toString();
 log("Phantom connecté");
 refreshBal();
}
async function refreshBal(){
 try{
  let a=document.getElementById("solAddr").value;
  if(!a)return;
  let c=new solanaWeb3.Connection("https://api.mainnet-beta.solana.com");
  let sol=(await c.getBalance(new solanaWeb3.PublicKey(a)))/1e9;
  document.getElementById("solBal").textContent=sol.toFixed(5);
  document.getElementById("usdcBal").textContent="-"; // laisser en attente
  log("Soldes SOL rafraîchis");
 }catch(e){log("Erreur solde "+e)}
}

/* === POWCHAIN LIVE WS === */
let ws=null;
function connectWS(){
 ws=new WebSocket(WS);
 ws.onopen = ()=>log("WS connecté");
 ws.onclose = ()=>{log("WS fermé, reconnexion dans 3s...");setTimeout(connectWS,3000);}
 ws.onerror = e=>log("Erreur WS "+e);
 ws.onmessage = m=>{let o=JSON.parse(m.data);update(o);}
}
function update(o){
 if(o.height) document.querySelector("#h").textContent=o.height;
 if(o.lpPow) document.querySelector("#lpPow").textContent=(o.lpPow/DEC).toFixed(2);
 if(o.lpUsdc) document.querySelector("#lpUsdc").textContent=(o.lpUsdc/DEC).toFixed(2);
 if(o.trez) document.querySelector("#trez").textContent=(o.trez/DEC).toFixed(2);
 document.querySelector("#status").textContent="en ligne";
}
connectWS();

/* === API === */
async function ping(){
 try{
  let r=await fetch(API+"/stats");
  let j=await r.json();
  update(j);
  log("Ping OK");
 }catch(e){log("Ping échoué "+e)}
}
</script>

<script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.js"></script>
</body>
</html>
