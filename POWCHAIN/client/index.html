<!doctype html><html lang=fr><head><meta charset=utf-8><meta name=viewport content=width=device-width,initial-scale=1><title>POWCHAIN Wallet</title><style>body{margin:0;background:#05070b;color:#d5dade;font-family:system-ui;overflow:hidden}button,input{border-radius:6px;border:1px solid #09f;background:#00111d;color:#8ff;padding:7px;margin:4px 0;font-size:14px}#wrap{display:flex;height:100vh}#left{width:300px;border-right:1px solid #044;padding:10px;overflow:auto}#main{flex:1;position:relative;padding:10px;overflow:auto}#log{position:absolute;bottom:0;left:0;width:100%;height:160px;background:#0009;border-top:1px solid #044;overflow:auto;font-size:12px;padding:6px;white-space:pre-wrap}</style></head><body><div id=wrap><div id=left><h2 style="text-align:center;color:#0ff">POWCHAIN</h2><label>Adresse</label><input id=addr><label>Clé privée</label><input id=priv><button onclick="sync()">Connexion / Refresh</button><hr><div>POW: <span id=pow>-</span></div><div>USDC POW: <span id=usd>-</span></div><div>Staked: <span id=stk>-</span></div><hr><h3>Swap</h3><input id=swapAmt placeholder="Montant"><select id=swapPair><option value="POW→USD">POW → USD</option><option value="USD→POW">USD → POW</option></select><button onclick="swap()">Swap</button><hr><h3>Staking</h3><input id=stakeAmt placeholder="POW"><button onclick="stake()">Locker</button><button onclick="unstake()">Délocker</button><hr><h3>LP</h3><input id=lpPow placeholder="POW"><input id=lpUsd placeholder="USDC"><button onclick="addLP()">Add LP</button><button onclick="remLP()">Remove LP</button><hr><button onclick="sync()">🔄 Refresh</button></div><div id=main><h3>Blockchain Live</h3><div>Mempool: <span id=mempool>-</span></div><div>Bloc: <span id=block>-</span></div><div>Total POW: <span id=total>-</span></div><div>TVL LP: <span id=tvl>-</span></div><div id=log></div></div></div><script>
const API = location.origin;
const $ = id => document.getElementById(id);

function log(t){$("log").textContent+=t+"\n";$("log").scrollTop=$("log").scrollHeight}

function loadWallet(){
  let a = localStorage.powAddr, p = localStorage.powPriv;
  if(!a || !p){
    a="POW-"+Math.random().toString(36).substring(2,10).toUpperCase();
    p=crypto.randomUUID().replace(/-/g,"");
    localStorage.powAddr=a;
    localStorage.powPriv=p;
  }
  $("addr").value=a;
  $("priv").value=p;
}
loadWallet();

async function req(p,m="GET",d=null){
  let o={method:m,headers:{"Content-Type":"application/json"}};
  if(d)o.body=JSON.stringify(d);
  return fetch(API+p,o).then(r=>r.json()).catch(e=>log("ERR "+e));
}

async function sync(){
  let r=await req("/state"); if(!r)return;
  let a=$("addr").value;
  $("pow").textContent=r.balances[a]?.pow||0;
  $("usd").textContent=r.balances[a]?.usd||0;
  $("stk").textContent=r.balances[a]?.staked||0;
  $("mempool").textContent=r.mempool.length;
  $("block").textContent=r.block;
  $("total").textContent=r.totalSupply;
  $("tvl").textContent=r.lpTvl;
}

async function signSend(type,obj){
  let a=$("addr").value, p=$("priv").value;
  let tx={type,from:a,nonce:Date.now(),...obj};
  let msg=new TextEncoder().encode(JSON.stringify(tx));
  let sig=await crypto.subtle.digest("SHA-256",msg);
  tx.sig=btoa(String.fromCharCode(...new Uint8Array(sig)));
  let r=await req("/tx","POST",tx);
  log("TX "+type+" => "+JSON.stringify(r));
  sync();
}

function swap(){let x=parseFloat($("swapAmt").value);if(!x)return;let p=$("swapPair").value==="POW→USD"?"POWtoUSD":"USDtoPOW";signSend("swap",{pair:p,amount:x})}
function stake(){let x=parseFloat($("stakeAmt").value);if(!x)return;signSend("stake",{amount:x})}
function unstake(){signSend("unstake",{})}
function addLP(){let a=parseFloat($("lpPow").value),b=parseFloat($("lpUsd").value);if(!a||!b)return;signSend("addLP",{pow:a,usd:b})}
function remLP(){signSend("remLP",{})}
setInterval(sync,4000);
</script></body></html>
