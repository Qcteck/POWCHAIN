<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>POWCHAIN — Dashboard Complet</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#05070b;
      --bg-alt:#0b1018;
      --bg-card:#101623;
      --bg-card-soft:#151c2b;
      --border:#252f3f;
      --accent:#3b82f6;
      --accent-soft:#60a5fa;
      --accent-strong:#1d4ed8;
      --text-main:#e5ecff;
      --text-muted:#9ca3b8;
      --danger:#ef4444;
      --ok:#22c55e;
      --warn:#eab308;
    }
    body{
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:radial-gradient(circle at top,#0b1220,#020617 55%,#000);
      color:var(--text-main);
      min-height:100vh;
      display:flex;
      align-items:stretch;
      justify-content:center;
    }
    #app{
      width:100%;
      max-width:1300px;
      margin:18px;
      border-radius:14px;
      background:radial-gradient(circle at top left,#111827,#020617 60%,#020617);
      border:1px solid var(--border);
      box-shadow:0 0 35px rgba(0,0,0,0.85);
      padding:16px 18px 18px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .title-block{
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    .title-main{
      font-size:20px;
      font-weight:600;
      letter-spacing:2px;
      text-transform:uppercase;
      color:var(--accent-soft);
    }
    .title-sub{
      font-size:12px;
      color:var(--text-muted);
    }
    .status-bar{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      font-size:11px;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      background:linear-gradient(135deg,#020617,#020617,#020617);
      color:var(--text-muted);
    }
    .chip-strong{
      border-color:var(--accent-strong);
      color:var(--accent-soft);
      background:radial-gradient(circle at top,var(--bg-card-soft),#020617 70%);
    }
    .dot{
      width:8px;
      height:8px;
      border-radius:999px;
      background:var(--danger);
      box-shadow:0 0 6px rgba(248,113,113,0.6);
    }
    .dot.ok{
      background:var(--ok);
      box-shadow:0 0 8px rgba(34,197,94,0.8);
    }
    .dot.warn{
      background:var(--warn);
      box-shadow:0 0 8px rgba(234,179,8,0.8);
    }
    main{
      display:grid;
      grid-template-columns:1.1fr 1fr;
      grid-template-rows:auto auto 1fr;
      gap:10px;
      min-height:520px;
    }
    .card{
      position:relative;
      border-radius:10px;
      border:1px solid var(--border);
      background:radial-gradient(circle at top left,#111827,#020617 65%,#020617);
      padding:10px 12px 11px;
      overflow:hidden;
    }
    .card::before{
      content:"";
      position:absolute;
      inset:-80px auto auto 40%;
      width:260px;
      height:260px;
      background:radial-gradient(circle,rgba(96,165,250,0.35),transparent 70%);
      opacity:0.25;
      pointer-events:none;
    }
    .card-header{
      position:relative;
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:6px;
      z-index:1;
    }
    .card-title{
      font-size:14px;
      font-weight:500;
      letter-spacing:1px;
      text-transform:uppercase;
      color:var(--accent-soft);
    }
    .card-sub{
      font-size:11px;
      color:var(--text-muted);
      margin-top:1px;
    }
    .card-badges{
      display:flex;
      gap:6px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .badge{
      font-size:10px;
      padding:2px 7px;
      border-radius:999px;
      border:1px solid var(--border);
      color:var(--text-muted);
      background:rgba(15,23,42,0.86);
      white-space:nowrap;
    }
    .badge-accent{
      border-color:var(--accent-strong);
      color:var(--accent-soft);
    }
    .card-body{
      position:relative;
      z-index:1;
      font-size:12px;
      color:var(--text-main);
    }
    .grid-2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }
    .grid-3{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:8px;
    }
    .stats-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:6px;
    }
    .stat-block{
      min-width:110px;
      flex:1 1 90px;
    }
    .stat-label{
      font-size:11px;
      color:var(--text-muted);
    }
    .stat-value{
      font-size:13px;
      color:var(--text-main);
      margin-top:1px;
    }
    .stat-value-strong{
      font-size:14px;
      font-weight:600;
      color:var(--accent-soft);
    }
    label{
      display:block;
      font-size:11px;
      color:var(--text-muted);
      margin-bottom:2px;
    }
    input,select,button,textarea{
      font-family:inherit;
      font-size:12px;
      border-radius:6px;
      border:1px solid #1f2937;
      outline:none;
    }
    input,select,textarea{
      width:100%;
      padding:6px 8px;
      background:#020617;
      color:var(--text-main);
    }
    input:focus,select:focus,textarea:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 1px rgba(59,130,246,0.55);
    }
    button{
      padding:6px 10px;
      background:linear-gradient(120deg,#1d4ed8,#2563eb,#38bdf8);
      color:#f9fafb;
      border:1px solid #1d4ed8;
      cursor:pointer;
      font-weight:500;
      letter-spacing:.5px;
      box-shadow:0 0 12px rgba(37,99,235,0.7);
      transition:background .15s,transform .1s,box-shadow .15s;
      white-space:nowrap;
    }
    button:hover{
      transform:translateY(-1px);
      box-shadow:0 0 18px rgba(56,189,248,0.9);
    }
    button:active{
      transform:translateY(0);
      box-shadow:0 0 10px rgba(37,99,235,0.7);
    }
    button.secondary{
      background:#020617;
      border-color:#1f2937;
      color:var(--text-muted);
      box-shadow:none;
    }
    button.secondary:hover{
      border-color:#374151;
      box-shadow:0 0 8px rgba(15,23,42,0.6);
    }
    button.small{
      padding:4px 8px;
      font-size:11px;
    }
    .row{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      margin-top:6px;
    }
    .row > *{
      flex:1 1 0;
    }
    .mono{
      font-family:ui-monospace,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      font-size:11px;
    }
    #log{
      width:100%;
      height:170px;
      background:#020617;
      border-radius:8px;
      border:1px solid #111827;
      padding:7px 8px;
      font-size:11px;
      font-family:ui-monospace,Consolas,monospace;
      color:#cbd5f5;
      overflow-y:auto;
      white-space:pre-wrap;
    }
    #chart-pow{
      width:100%;
      height:120px;
      background:#020617;
      border-radius:6px;
      border:1px solid #111827;
      display:block;
    }
    .list{
      margin-top:6px;
      max-height:130px;
      overflow-y:auto;
      border-radius:6px;
      border:1px solid #111827;
      background:#020617;
      padding:4px 6px;
      font-size:11px;
    }
    .list-item{
      padding:3px 2px;
      border-bottom:1px solid rgba(31,41,55,0.7);
      display:flex;
      justify-content:space-between;
      gap:6px;
      align-items:center;
    }
    .list-item:last-child{
      border-bottom:none;
    }
    .addr{
      max-width:180px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-family:ui-monospace,Consolas,monospace;
      color:#bfdbfe;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:4px;
      padding:2px 7px;
      border-radius:999px;
      font-size:10px;
      border:1px solid #1f2937;
      background:#020617;
      color:var(--text-muted);
    }
    .pill-ok{
      border-color:var(--ok);
      color:#bbf7d0;
    }
    .pill-warn{
      border-color:var(--warn);
      color:#facc15;
    }
    .pill-err{
      border-color:var(--danger);
      color:#fecaca;
    }
    @media(max-width:1024px){
      main{
        grid-template-columns:1fr;
        grid-template-rows:auto;
      }
    }
    @media(max-width:720px){
      #app{
        margin:10px;
        padding:12px;
      }
      header{
        flex-direction:column;
        align-items:flex-start;
      }
      .status-bar{
        justify-content:flex-start;
      }
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="title-block">
      <div class="title-main">POWCHAIN — DASHBOARD COMPLET</div>
      <div class="title-sub">Réseau PoS + LP interne + Wallet local + Solana Phantom</div>
    </div>
    <div class="status-bar">
      <div class="chip chip-strong">
        <span class="dot" id="dot-api"></span>
        <span id="txt-api">API hors ligne</span>
      </div>
      <div class="chip">
        <span class="dot" id="dot-ws"></span>
        <span id="txt-ws">WS non connecté</span>
      </div>
      <div class="chip">
        <span id="txt-height">Bloc: -</span>
      </div>
    </div>
  </header>
  <main>
