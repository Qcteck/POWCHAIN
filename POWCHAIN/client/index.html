<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>POWCHAIN — Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#020617;color:#e5e7eb;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px}
#wrap{width:100%;max-width:1200px;background:radial-gradient(circle at top,#0f172a,#020617 60%,#000 100%);border-radius:12px;border:1px solid #1f2937;box-shadow:0 20px 60px rgba(0,0,0,.8);padding:20px}
h1{text-align:center;margin-bottom:18px;color:#38bdf8;letter-spacing:.08em;font-size:22px;text-shadow:0 0 8px #0ea5e9}
h1 span{font-weight:400;color:#9ca3af}
.row{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.card{flex:1 1 0;min-width:260px;background:rgba(15,23,42,.9);border-radius:10px;border:1px solid #1f2937;padding:14px;box-shadow:0 0 20px rgba(0,0,0,.5)}
.card h2{font-size:15px;margin-bottom:8px;color:#bfdbfe;text-transform:uppercase;letter-spacing:.12em}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid #4b5563;background:rgba(15,23,42,.9);margin-bottom:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#ef4444;box-shadow:0 0 8px #ef4444}
.dot.on{background:#22c55e;box-shadow:0 0 8px #22c55e}
.label{font-size:12px;color:#9ca3af}
.value{font-size:13px;color:#e5e7eb}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:6px}
.field{display:flex;flex-direction:column;font-size:13px;padding:4px 6px;border-radius:6px;background:rgba(15,23,42,.95);border:1px solid #111827}
.field span:first-child{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#9ca3af;margin-bottom:2px}
input,select,button,textarea{font-family:inherit;font-size:13px;border-radius:6px;border:1px solid #1f2937;padding:7px 8px;background:#020617;color:#e5e7eb;outline:none}
input:focus,select:focus,textarea:focus{border-color:#38bdf8;box-shadow:0 0 0 1px rgba(56,189,248,.5)}
button{cursor:pointer;font-weight:500;background:linear-gradient(90deg,#0ea5e9,#22c55e);border:none;color:#0b1120;transition:.15s transform,.15s box-shadow}
button:hover{transform:translateY(-1px);box-shadow:0 10px 25px rgba(56,189,248,.4)}
button:active{transform:translateY(0);box-shadow:none}
button.secondary{background:#020617;border:1px solid #4b5563;color:#e5e7eb;box-shadow:none}
button.secondary:hover{background:#0b1120;border-color:#38bdf8}
#log{height:160px;background:#020617;border-radius:8px;border:1px solid #111827;padding:8px;font-size:11px;overflow:auto;white-space:pre-wrap;font-family:ui-monospace,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;color:#9ca3af}
#log b{color:#e5e7eb}
textarea{resize:vertical;min-height:48px}
@media(max-width:900px){.row{flex-direction:column}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="wrap">
<h1>POWCHAIN <span>— Dashboard</span></h1>

<div class="row">
  <div class="card">
    <h2>Blockchain</h2>
    <div class="badge">
      <span class="dot" id="nodeDot"></span>
      <span id="nodeStatus">Noeud hors ligne</span>
    </div>
    <div class="grid2">
      <div class="field">
        <span>Hauteur</span>
        <span class="value" id="height">?</span>
      </div>
      <div class="field">
        <span>Supply POW</span>
        <span class="value" id="supplyPow">?</span>
      </div>
      <div class="field">
        <span>LP POW</span>
        <span class="value" id="lpPow">?</span>
      </div>
      <div class="field">
        <span>LP USDC</span>
        <span class="value" id="lpUsdc">?</span>
      </div>
      <div class="field">
        <span>Trésorerie POW</span>
        <span class="value" id="treasuryPow">?</span>
      </div>
      <div class="field">
        <span>Trésorerie USDC</span>
        <span class="value" id="treasuryUsdc">?</span>
      </div>
    </div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
      <button id="btnPing" class="secondary" type="button">Ping stats</button>
      <button id="btnForceState" class="secondary" type="button">Demander état complet</button>
    </div>
  </div>

  <div class="card">
    <h2>Wallet</h2>
    <div class="field">
      <span>Adresse publique</span>
      <input id="pub" placeholder="Adresse PUB (bs58)"/>
    </div>
    <div class="field" style="margin-top:6px">
      <span>Clé privée</span>
      <textarea id="priv" placeholder="Clé PRIV (bs58). Ne jamais partager."></textarea>
    </div>
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
      <button id="btnLoad" type="button">Charger le wallet</button>
      <button id="btnClear" class="secondary" type="button">Effacer local</button>
    </div>
    <div class="grid2" style="margin-top:8px">
      <div class="field">
        <span>SOLDE POW</span>
        <span class="value" id="walletPow">?</span>
      </div>
      <div class="field">
        <span>SOLDE USDC</span>
        <span class="value" id="walletUsdc">?</span>
      </div>
      <div class="field">
        <span>STAKE POW</span>
        <span class="value" id="walletStake">?</span>
      </div>
      <div class="field">
        <span>Nonce</span>
        <span class="value" id="walletNonce">?</span>
      </div>
    </div>
  </div>
</div>

<div class="card" style="margin-bottom:16px">
  <h2>Transaction</h2>
  <div class="row" style="margin-bottom:8px">
    <div class="field" style="flex:1">
      <span>Type</span>
      <select id="txType">
        <option value="transfer">Transfer</option>
        <option value="stake">Stake</option>
        <option value="unstake">Unstake</option>
        <option value="mint">Mint USDC POW (admin)</option>
      </select>
    </div>
    <div class="field" style="flex:2">
      <span>Destinataire (to)</span>
      <input id="txTo" placeholder="Adresse destinataire (PUB)"/>
    </div>
    <div class="field" style="flex:1">
      <span>Token</span>
      <select id="txToken">
        <option value="pow">POW</option>
        <option value="usdc">USDC POW</option>
      </select>
    </div>
    <div class="field" style="flex:1">
      <span>Montant</span>
      <input id="txAmount" type="number" step="0.0001" min="0" placeholder="0.0"/>
    </div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <button id="btnSend" type="button">Envoyer TX (WebSocket)</button>
    <span class="label" id="wsStatus">WS: déconnecté</span>
  </div>
</div>

<div class="card">
  <h2>Journal</h2>
  <div id="log"></div>
</div>
</div>

<script>
// Configuration distante
const API = "https://bbqfinance.fun/powchain";
const WS  = "wss://bbqfinance.fun/powchain/ws";

// Elements
const el = id => document.getElementById(id);
const nodeDot = el("nodeDot");
const nodeStatus = el("nodeStatus");
const heightEl = el("height");
const supplyPowEl = el("supplyPow");
const lpPowEl = el("lpPow");
const lpUsdcEl = el("lpUsdc");
const treasuryPowEl = el("treasuryPow");
const treasuryUsdcEl = el("treasuryUsdc");
const walletPowEl = el("walletPow");
const walletUsdcEl = el("walletUsdc");
const walletStakeEl = el("walletStake");
const walletNonceEl = el("walletNonce");
const wsStatusEl = el("wsStatus");
const logEl = el("log");

// Log helper
function log(msg){const d=new Date();const t=d.toISOString().substr(11,8);logEl.textContent+="["+t+"] "+msg+"\n";logEl.scrollTop=logEl.scrollHeight;}

// Stats
async function refreshStats(){
  try{
    const res=await fetch(API+"/stats",{cache:"no-store"});
    if(!res.ok){log("Erreur stats HTTP "+res.status);setNodeOnline(false);return;}
    const j=await res.json();
    setNodeOnline(true);
    heightEl.textContent=j.height??"?";
    supplyPowEl.textContent=j.supplyPow??j.lpPow??"?";
    lpPowEl.textContent=j.lpPow??"?";
    lpUsdcEl.textContent=j.lpUsdc??"?";
    treasuryPowEl.textContent=j.treasuryPow??"?";
    treasuryUsdcEl.textContent=j.treasuryUsdc??"?";
  }catch(e){
    log("Erreur stats POWCHAIN : "+e.message);
    setNodeOnline(false);
  }
}

function setNodeOnline(on){
  if(on){nodeDot.classList.add("on");nodeStatus.textContent="Noeud en ligne";}else{nodeDot.classList.remove("on");nodeStatus.textContent="Noeud hors ligne";}
}

// WebSocket
let ws=null;
let wsTimer=null;

function connectWS(){
  if(ws && (ws.readyState===WebSocket.OPEN || ws.readyState===WebSocket.CONNECTING))return;
  log("Connexion WebSocket en cours...");
  wsStatusEl.textContent="WS: connexion...";
  try{
    ws=new WebSocket(WS);
  }catch(e){
    log("Erreur ouverture WS: "+e.message);
    wsStatusEl.textContent="WS: erreur";
    return;
  }
  ws.onopen=()=>{
    log("WebSocket ouvert");
    wsStatusEl.textContent="WS: connecté";
    if(wsTimer){clearTimeout(wsTimer);wsTimer=null;}
    sendWS({type:"hello",client:"dashboard"});
  };
  ws.onmessage=ev=>{
    try{
      const msg=JSON.parse(ev.data);
      handleWSMessage(msg);
    }catch(e){
      log("Message WS brut: "+ev.data);
    }
  };
  ws.onclose=()=>{
    log("WS fermé, reconnexion dans 3 s...");
    wsStatusEl.textContent="WS: déconnecté";
    wsTimer=setTimeout(connectWS,3000);
  };
  ws.onerror=err=>{
    log("Erreur WS: "+err.message??"");
  };
}

function sendWS(obj){
  if(!ws || ws.readyState!==WebSocket.OPEN){
    log("Impossible d'envoyer, WS non connecté");
    return;
  }
  ws.send(JSON.stringify(obj));
}

function handleWSMessage(msg){
  if(msg.type==="state" && msg.chain){
    const c=msg.chain;
    heightEl.textContent=c.height??"?";
    supplyPowEl.textContent=c.supplyPow??"?";
    lpPowEl.textContent=c.lpPow??"?";
    lpUsdcEl.textContent=c.lpUsdc??"?";
    treasuryPowEl.textContent=c.treasuryPow??"?";
    treasuryUsdcEl.textContent=c.treasuryUsdc??"?";
    if(msg.wallet){
      const w=msg.wallet;
      walletPowEl.textContent=w.pow??"?";
      walletUsdcEl.textContent=w.usdc??"?";
      walletStakeEl.textContent=w.staked??"?";
      walletNonceEl.textContent=w.nonce??"?";
    }
    setNodeOnline(true);
    log("Etat complet reçu");
  }else if(msg.type==="txResult"){
    log("Resultat TX: "+(msg.ok?"ok":"erreur")+" "+(msg.reason||""));
  }else if(msg.type==="ping"){
    log("Ping retour: "+(msg.height??"?"));
  }else{
    log("WS: "+JSON.stringify(msg));
  }
}

// Wallet local (sans génération automatique)
function saveWalletLocal(pub,priv){
  try{localStorage.setItem("powchain_pub",pub);localStorage.setItem("powchain_priv",priv);}catch(e){}
}
function loadWalletLocal(){
  try{
    const pub=localStorage.getItem("powchain_pub")||"";
    const priv=localStorage.getItem("powchain_priv")||"";
    el("pub").value=pub;
    el("priv").value=priv;
    if(pub)log("Wallet chargé depuis le stockage local");
  }catch(e){}
}

// TX
function sendTx(){
  const type=el("txType").value;
  const to=el("txTo").value.trim();
  const token=el("txToken").value;
  const amount=parseFloat(el("txAmount").value);
  const pub=el("pub").value.trim();
  const priv=el("priv").value.trim();
  if(!pub||!priv){log("Veuillez remplir PUB et PRIV avant d'envoyer une transaction.");return;}
  if(!Number.isFinite(amount)||amount<=0){log("Montant invalide.");return;}
  const tx={type,from:pub,to,token,amount};
  log("TX préparée: "+JSON.stringify(tx));
  // Ici on envoie brut au validateur, qui fera la vérification et la signature côté serveur,
  // car on ne regénère pas les clés côté client dans cette version.
  sendWS({type:"tx",tx,auth:{pub,priv}});
}

// Boutons
el("btnPing").onclick=()=>{refreshStats();sendWS({type:"ping"});};
el("btnForceState").onclick=()=>{sendWS({type:"requestState"});};
el("btnLoad").onclick=()=>{
  const pub=el("pub").value.trim();
  const priv=el("priv").value.trim();
  if(!pub||!priv){log("PUB et PRIV requis pour charger le wallet.");return;}
  saveWalletLocal(pub,priv);
  log("Wallet enregistré localement.");
  sendWS({type:"loadWallet",pub});
};
el("btnClear").onclick=()=>{
  try{localStorage.removeItem("powchain_pub");localStorage.removeItem("powchain_priv");}catch(e){}
  el("pub").value="";el("priv").value="";
  walletPowEl.textContent="?";walletUsdcEl.textContent="?";walletStakeEl.textContent="?";walletNonceEl.textContent="?";
  log("Wallet local effacé.");
};
el("btnSend").onclick=sendTx;

// Init
loadWalletLocal();
refreshStats();
connectWS();
setInterval(refreshStats,15000);
</script>
</body>
</html>
