<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>POWCHAIN — Client + Solana</title>
  <script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tweetnacl/1.0.3/nacl.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bs58/5.0.0/bs58.min.js"></script>
  <style>
    body{margin:0;background:#05070b;color:#e5ecff;font-family:system-ui,Arial;}
    #wrap{max-width:1000px;margin:20px auto;padding:16px;border-radius:12px;border:1px solid #222b37;background:#0b111c;box-shadow:0 0 18px #000;}
    h2{text-align:center;margin:4px 0 12px;color:#8ff;}
    h3{margin:6px 0;color:#a8d9ff;}
    .row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;}
    .card{flex:1 1 280px;background:#111823;padding:12px;border-radius:8px;border:1px solid #1e2630;}
    input,button,select{width:100%;padding:8px;margin-top:6px;border-radius:6px;border:1px solid #304050;background:#0c1521;color:#c5e3ff;font-size:14px;box-sizing:border-box;}
    button{cursor:pointer;background:#06263d;border:1px solid #0af;}button:hover{background:#083553;}
    #log{height:240px;overflow:auto;margin-top:12px;background:#0004;border:1px solid #1e2630;border-radius:8px;padding:8px;font-size:13px;white-space:pre-wrap;}
    .tag{font-size:12px;opacity:.8;}
  </style>
</head>
<body>
<div id="wrap">
  <h2>POWCHAIN — Client Complet</h2>

  <div class="row">
    <div class="card">
      <h3>Solana — Phantom</h3>
      <button onclick="connectPhantom()">Connecter Phantom</button>
      <div id="phantomStatus" class="tag">En attente de connexion…</div>
      <div id="solanaAddr"></div>
      <div id="solanaBalances"></div>
    </div>

    <div class="card">
      <h3>Wallet POWCHAIN</h3>
      <input id="powPriv" placeholder="Clé privée POWCHAIN (base58)" />
      <input id="powPub" placeholder="Adresse POWCHAIN (base58, auto-remplie)" />
      <button onclick="generatePowWallet()">Générer & connecter un nouveau wallet</button>
      <button onclick="loadPowWallet()">Connecter un wallet existant</button>
      <button onclick="forgetPowWallet()">Oublier du navigateur</button>
      <div id="powMemStatus" class="tag"></div>
      <div id="powAddr"></div>
      <div id="powBalances"></div>
    </div>
  </div>

  <div class="row">
    <div class="card">
      <h3>Transfert POW</h3>
      <input id="to" placeholder="Adresse destinataire POWCHAIN"/>
      <input id="amount" placeholder="Montant POW"/>
      <button onclick="sendPOW()">Envoyer POW</button>
    </div>
    <div class="card">
      <h3>Staking</h3>
      <input id="stakeAmt" placeholder="Montant POW"/>
      <button onclick="stake()">Stake</button>
      <button onclick="unstake()">Unstake</button>
    </div>
    <div class="card">
      <h3>LP POW / USDC POW</h3>
      <input id="lpAmt" placeholder="Montant POW"/>
      <button onclick="addLP()">Ajouter LP</button>
      <button onclick="removeLP()">Retirer LP</button>
    </div>
    <div class="card">
      <h3>Swap</h3>
      <input id="swapAmt" placeholder="Montant"/>
      <select id="swapSel">
        <option value="powToUsdc">POW → USDC POW</option>
        <option value="usdcToPow">USDC POW → POW</option>
      </select>
      <button onclick="swap()">Swap</button>
    </div>
  </div>

  <h3>Logs</h3>
  <div id="log"></div>
</div>

<script>
/* ========= CONFIG ========= */
const SOL_RPC = "https://lb.drpc.live/solana/Ah_pmhKMs0qntHMrHyHMTvqg8lcNcRkR8LWNEklbR4ac";
const USDC_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1";
const POW_LS_KEY = "powchain_wallet_v1";

/* ========= LOG ========= */
function log(t){
  const L=document.getElementById("log");L.textContent+=t+"\\n";L.scrollTop=L.scrollHeight;
}

/* ========= SOLANA / PHANTOM ========= */
let solConnection = new solanaWeb3.Connection(SOL_RPC,"confirmed");
let solPubKey = null;

async function connectPhantom(){
  if(!window.solana || !window.solana.isPhantom){log("⚠ Phantom non détecté");return;}
  try{
    const resp = await window.solana.connect();
    solPubKey = resp.publicKey;
    document.getElementById("phantomStatus").textContent = "Phantom connecté ✅";
    document.getElementById("solanaAddr").textContent = "Adresse Solana : " + solPubKey;
    refreshSolanaBalances();
    log("🟢 Phantom : " + solPubKey);
  }catch(e){log("⚠ Erreur Phantom : "+e.message);}
}

async function refreshSolanaBalances(){
  if(!solPubKey) return;
  try{
    const sol = (await solConnection.getBalance(solPubKey)) / 1e9;
    const usdcMint = new solanaWeb3.PublicKey(USDC_MINT);
    const t = await solConnection.getParsedTokenAccountsByOwner(solPubKey,{mint:usdcMint});
    let usdc = 0;
    for(const a of t.value){
      const d=a.account.data.parsed.info.tokenAmount;
      if(d.decimals===6) usdc+=parseFloat(d.uiAmountString);
    }
    document.getElementById("solanaBalances").textContent = "SOL: "+sol.toFixed(4)+" | USDC: "+usdc.toFixed(2);
  }catch(e){log("⚠ Erreur soldes Solana");}
}

/* ========= POWCHAIN ========= */
const ws = new WebSocket("wss://bbqfinance.fun:7001");
let powState = {priv:"",pub:"",addr:"",nonce:0};

ws.onopen = ()=>log("WS POWCHAIN connecté");
ws.onerror = ()=>log("⚠ Erreur WS POWCHAIN");
ws.onclose = ()=>log("WS POWCHAIN fermé");
ws.onmessage = (m)=>{
  let j;try{j=JSON.parse(m.data);}catch(e){return log("⟹ "+m.data);}
  if(j.type==="state"&&j.wallet){
    powState.nonce=j.wallet.nonce||0;
    const w=j.wallet;
    document.getElementById("powBalances").textContent="POW:"+ (w.pow||0)
      +" | USDC POW:"+ (w.usdc||0)+" | LP:"+ (w.lp||0)+" | Stakés:"+ (w.staked||0);
  }
  if(j.msg) log("ℹ "+j.msg);
};

function wsSend(o){if(ws.readyState===1) ws.send(JSON.stringify(o)); else log("⚠ WS not ready");}

/* ========= POW WALLET — Générer / Charger / Mémoriser ========= */
function setPowUi(){document.getElementById("powPriv").value=powState.priv;document.getElementById("powPub").value=powState.pub;document.getElementById("powAddr").textContent=powState.addr?"Adresse POWCHAIN : "+powState.addr:"";}

function savePow(){if(powState.priv&&powState.pub){localStorage.setItem(POW_LS_KEY,JSON.stringify({priv:powState.priv,pub:powState.pub}));document.getElementById("powMemStatus").textContent="Mémorisé dans le navigateur";}}

function forgetPowWallet(){localStorage.removeItem(POW_LS_KEY);powState={priv:"",pub:"",addr:"",nonce:0};setPowUi();document.getElementById("powMemStatus").textContent="Wallet oublié";log("ℹ Wallet POWCHAIN oublié");}

function generatePowWallet(){
  const seed=new Uint8Array(32);crypto.getRandomValues(seed);
  const kp=nacl.sign.keyPair.fromSeed(seed);
  powState.priv=bs58.encode(seed);
  powState.pub=bs58.encode(kp.publicKey);
  powState.addr=powState.pub;powState.nonce=0;
  setPowUi();savePow();requestState();
  log("🆕 Wallet POW généré : "+powState.addr);
}

function loadPowWallet(){
  let priv=document.getElementById("powPriv").value.trim();
  let pub=document.getElementById("powPub").value.trim();
  if(!priv) return log("⚠ Clé privée manquante");
  try{
    const seed=bs58.decode(priv);
    const kp=nacl.sign.keyPair.fromSeed(seed);
    if(!pub) pub=bs58.encode(kp.publicKey);
    powState={priv,pub,addr:pub,nonce:0};
    setPowUi();savePow();requestState();
    log("🔑 Wallet POW connecté : "+powState.addr);
  }catch(e){log("⚠ Clé invalide");}
}

function loadPowFromStorage(auto){
  try{
    const raw=localStorage.getItem(POW_LS_KEY);
    if(!raw) return;
    const w=JSON.parse(raw);
    powState={priv:w.priv,pub:w.pub,addr:w.pub,nonce:0};
    setPowUi();document.getElementById("powMemStatus").textContent="Wallet restauré";
    if(auto){requestState();log("♻ Wallet POW restauré : "+powState.addr);}
  }catch(e){}
}

function ensurePow(){if(!powState.priv||!powState.pub){log("⚠ Connecte ou génère un wallet POWCHAIN");return false;}return true;}
function requestState(){if(ensurePow()) wsSend({type:"requestState",pub:powState.pub});}

/* ========= SIGNATURE DES TX ========= */
function signAndSend(type,obj){
  if(!ensurePow()) return;
  const tx={type,from:powState.addr,pub:powState.pub,nonce:(powState.nonce||0)+1,...obj};
  const msg=new TextEncoder().encode(JSON.stringify({type:tx.type,from:tx.from,to:tx.to??null,amount:tx.amount??null,token:tx.token??null,nonce:tx.nonce}));
  const sig=nacl.sign.detached(msg,bs58.decode(powState.priv));
  tx.sig=bs58.encode(sig);
  wsSend(tx);powState.nonce=tx.nonce;
  log("📨 TX envoyée : "+type);
}

/* ========= ACTIONS ========= */
const sendPOW = ()=>{const to=toEl.value.trim();const amount=+amountEl.value;if(!to||!amount) return log("⚠ données manquantes");signAndSend("transfer",{to,amount});};
const stake = ()=>{const v=+stakeAmt.value;if(!v) return log("⚠ montant manquant");signAndSend("stake",{amount:v});};
const unstake = ()=>signAndSend("unstake",{});
const addLP = ()=>{const v=+lpAmt.value;if(!v) return log("⚠ montant");signAndSend("addLP",{amount:v});};
const removeLP = ()=>{const v=+lpAmt.value;if(!v) return log("⚠ montant");signAndSend("removeLP",{amount:v});};
const swap = ()=>{const v=+swapAmt.value;if(!v) return log("⚠ montant");signAndSend(document.getElementById("swapSel").value,{amount:v});};

/* ========= AUTO ========= */
window.addEventListener("load",()=>loadPowFromStorage(true));
</script>
</body>
</html>
