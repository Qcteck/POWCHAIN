<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>POWCHAIN Client</title>
<style>
body{background:#000;color:#0ff;font-family:Arial;text-align:center;padding:30px}
button{padding:8px 15px;margin:6px;border-radius:4px;border:1px solid #0ff;background:#022;color:#0ff}
#box{border:1px solid #0ff;padding:20px;border-radius:8px;max-width:370px;margin:auto;background:#011}
a{color:#0ff}
</style>
<script>
const BASE = location.origin.replace(/\/$/,'');
function call(path){return fetch(BASE+path).then(r=>r.json());}

function update(){
  call("/balance").then(b=>{
    balance.innerHTML=`<b>POW:</b> ${b.pow}<br><b>USDC:</b> ${b.usdc}`;
  });
  call("/mempool").then(m=>{
    mempool.innerText=JSON.stringify(m,null,2);
  });
  call("/blocks").then(b=>{
    blocks.innerText=JSON.stringify(b,null,2);
  });
}
function send(){
  const to=document.getElementById("to").value;
  const amount=document.getElementById("amount").value;
  call(`/send?to=${to}&amount=${amount}`).then(update);
}
function swap(type){
  const amount=document.getElementById("swapAmount").value;
  call(`/swap?type=${type}&amount=${amount}`).then(update);
}
setInterval(update,1500);
</script>
</head>
<body>
<h1>🔥 POWCHAIN ONLINE</h1>

<div id="box">
<p>Client connecté à: <br><b id="srv"></b></p>
<script>srv.innerText=BASE;</script>

<h3>Balance</h3>
<div id="balance">Chargement...</div><br>

<h3>Envoyer POW</h3>
<input id="to" placeholder="Adresse du destinataire"/><br>
<input id="amount" type="number" placeholder="Montant POW"/><br>
<button onclick="send()">Envoyer</button><br><br>

<h3>Swap</h3>
<input id="swapAmount" type="number" placeholder="Montant"/><br>
<button onclick="swap('POW→USDC')">POW → USDC</button>
<button onclick="swap('USDC→POW')">USDC → POW</button><br><br>

<h3>Mempool</h3>
<pre id="mempool" style="text-align:left;height:140px;overflow:auto;background:#000;border:1px solid #0ff;padding:6px"></pre>

<h3>Blocs</h3>
<pre id="blocks" style="text-align:left;height:140px;overflow:auto;background:#000;border:1px solid #0ff;padding:6px"></pre>
</div>
</body>
</html>
