<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>POWCHAIN — Wallet + Explorer</title>
<style>
body{margin:0;background:#05070b;color:#e5f4ff;font-family:system-ui}
#wrap{max-width:900px;margin:20px auto;padding:16px;border-radius:12px;background:#0c121d;border:1px solid #1e2937;box-shadow:0 0 15px #000}
h2{text-align:center;color:#6cf;text-shadow:0 0 8px #39f;margin:0 0 10px}
label{display:block;margin-top:10px;font-size:15px}
input,button{width:100%;padding:9px;margin-top:5px;border-radius:7px;border:1px solid #1e2937;background:#111a25;color:#bfe7ff;font-size:15px}
button{cursor:pointer;background:#0078ff;border:none}
#log{white-space:pre-wrap;background:#0008;margin-top:12px;padding:9px;border-radius:8px;height:220px;overflow:auto;font-size:13px}
.row{display:flex;gap:6px;margin-top:10px}
.row button{flex:1}
</style>
</head>
<body>
<div id="wrap">
<h2>🔥 POWCHAIN — Wallet</h2>

<label>Adresse</label>
<input id="addr" readonly/>

<label>Clé Privée</label>
<input id="priv" readonly/>

<div class="row">
<button onclick="newWallet()">Créer Wallet</button>
<button onclick="copy(addr.value)">Copier</button>
</div>

<h2>🔹 Balances</h2>
<div id="bal"></div>

<h2>💱 Actions</h2>
<div class="row">
<button onclick="req('mint',100)">Mint 100 POW</button>
<button onclick="req('mint_usdc',100)">Mint 100 USDC POW</button>
</div>
<div class="row">
<button onclick="req('stake',50)">Stake 50 POW</button>
<button onclick="req('unstake',50)">Unstake 50 POW</button>
</div>
<div class="row">
<button onclick="req('swap_pow_usdc',50)">Swap 50 POW → USDC</button>
<button onclick="req('swap_usdc_pow',50)">Swap 50 USDC → POW</button>
</div>

<pre id="log"></pre>
</div>

<script src="https://cdn.jsdelivr.net/npm/tweetnacl/nacl.min.js"></script>
<script>
/* === API VPS === */
const API="http://127.0.0.1:3000";
const WS ="ws://127.0.0.1:7001";
const DEC=1e6;

/* === LOG === */
function L(t){log.textContent += t+"\n"; log.scrollTop=log.scrollHeight}

/* === BASE58 === */
const ALPH="123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
function bs58enc(bytes){let d=[0],c;for(let b of bytes){for(let j=0;j<d.length;j++)d[j]*=256;d[0]+=b;for(let j=0;j<d.length;j++){c=d[j]%(58);d[j]= (d[j]/58)|0;if(j+1===d.length&&c)d.push(0);}}
  return d.reverse().map(v=>ALPH[v]).join("")}
function bs58dec(str){let d=[0],c;for(let ch of str){c=ALPH.indexOf(ch);for(let j=0;j<d.length;j++)d[j]*=58;d[0]+=c;for(let j=0;j<d.length;j++){c=d[j]%(256);d[j]=(d[j]/256)|0;if(j+1===d.length&&c)d.push(0);}}
  return Uint8Array.from(d.reverse())}

/* === WALLET === */
let pub=null,priv=null,nonce=0;
function newWallet(){
  const kp=nacl.sign.keyPair();
  pub=bs58enc(kp.publicKey);
  priv=bs58enc(kp.secretKey);
  addr.value=pub;
  priv.value=priv;
  nonce=0;
  L("🔑 Nouveau wallet généré");
  getBalances();
}
function copy(v){navigator.clipboard.writeText(v);L("📋 Copié")}

/* === REQUETES === */
async function req(type,amount){
  if(!pub || !priv) return L("⚠️ Crée un wallet avant");
  const body={type,amount,from:pub,nonce:nonce+1};
  const b=new TextEncoder().encode(JSON.stringify(body));
  const sig=nacl.sign.detached(b,bs58dec(priv));
  body.sig=bs58enc(sig);
  let r=await fetch(API+"/tx",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  let j=await r.json();
  L("🧾 "+JSON.stringify(j));
  if(j.ok) nonce++;
  getBalances();
}

/* === BALANCES === */
async function getBalances(){
  if(!pub) return;
  let r=await fetch(API+"/balances/"+pub);
  let j=await r.json();
  bal.textContent=
    `POW: ${j.pow}\nUSDC POW: ${j.usdc}\nStaked: ${j.staked}\nNonce: ${j.nonce}`;
}

/* === WS BLOCKS FEED === */
let ws=null;
function wsConnect(){
  ws=new WebSocket(WS);
  ws.onopen = () => L("🌐 WebSocket connecté");
  ws.onmessage = e => L("⛓ " + e.data);
  ws.onclose = () => {L("🔌 WS fermé → reconnexion...");setTimeout(wsConnect,1500)};
}
wsConnect();
</script>
</body>
</html>
