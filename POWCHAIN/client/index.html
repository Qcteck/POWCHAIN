<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>POWCHAIN — Client + Solana</title>
  <script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tweetnacl/1.0.3/nacl.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bs58/5.0.0/bs58.min.js"></script>
  <style>
    body{margin:0;background:#05070b;color:#e5ecff;font-family:system-ui,Arial;}
    #wrap{max-width:1000px;margin:20px auto;padding:16px;border-radius:12px;border:1px solid #222b37;background:#0b111c;box-shadow:0 0 18px #000;}
    h2{text-align:center;margin:4px 0 10px;color:#8ff;}
    h3{margin:8px 0 4px;color:#a8d9ff;}
    .row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;}
    .card{flex:1 1 260px;background:#111823;padding:12px;border-radius:8px;border:1px solid #1e2630;}
    input,button,select{width:100%;padding:8px;margin-top:6px;border-radius:6px;border:1px solid #304050;background:#0c1521;color:#c5e3ff;font-size:13px;box-sizing:border-box;}
    button{cursor:pointer;background:#06263d;border:1px solid #0af;}button:hover{background:#083553;}
    #log{height:220px;overflow:auto;margin-top:12px;background:#0004;border:1px solid #1e2630;border-radius:8px;padding:8px;font-size:13px;white-space:pre-wrap;}
    .tag{font-size:12px;opacity:.8;}
  </style>
</head>
<body>
<div id="wrap">
  <h2>POWCHAIN — Client Complet + Solana</h2>

  <!-- Ligne 1 : Solana / Phantom + Wallet POWCHAIN -->
  <div class="row">
    <div class="card">
      <h3>Solana — Phantom</h3>
      <button id="btnPhantom" onclick="connectPhantom()">Connecter Phantom</button>
      <div id="phantomStatus" class="tag">En attente de connexion…</div>
      <div id="solanaAddr"></div>
      <div id="solanaBalances"></div>
    </div>

    <div class="card">
      <h3>Wallet POWCHAIN</h3>
      <input id="powPriv" placeholder="Clé privée POWCHAIN (base58)"/>
      <input id="powPub" placeholder="Adresse POWCHAIN (base58, auto-remplie)" />
      <button onclick="generatePowWallet()">Générer & connecter un nouveau wallet</button>
      <button onclick="loadPowWallet()">Connecter un wallet existant</button>
      <button onclick="forgetPowWallet()">Oublier du navigateur</button>
      <div id="powMemStatus" class="tag"></div>
      <div id="powAddr"></div>
      <div id="powBalances"></div>
    </div>
  </div>

  <!-- Ligne 2 : actions POWCHAIN -->
  <div class="row">
    <div class="card">
      <h3>Envoyer POW</h3>
      <input id="to" placeholder="Adresse destinataire POWCHAIN"/>
      <input id="amount" placeholder="Montant POW"/>
      <button onclick="sendPOW()">Envoyer POW</button>
    </div>

    <div class="card">
      <h3>Staking POW</h3>
      <input id="stakeAmt" placeholder="Montant POW"/>
      <button onclick="stake()">Stake</button>
      <button onclick="unstake()">Unstake</button>
    </div>

    <div class="card">
      <h3>LP POW / USDC POW</h3>
      <input id="lpAmt" placeholder="Montant POW"/>
      <button onclick="addLP()">Ajouter LP</button>
      <button onclick="removeLP()">Retirer LP</button>
    </div>

    <div class="card">
      <h3>Swap interne</h3>
      <input id="swapAmt" placeholder="Montant"/>
      <select id="swapSel">
        <option value="powToUsdc">POW → USDC POW</option>
        <option value="usdcToPow">USDC POW → POW</option>
      </select>
      <button onclick="swap()">Swap</button>
    </div>
  </div>

  <h3>Logs</h3>
  <div id="log"></div>
</div>

<script>
/* ========= CONFIG ========= */
const SOL_RPC = "https://lb.drpc.live/solana/Ah_pmhKMs0qntHMrHyHMTvqg8lcNcRkR8LWNEklbR4ac";
const USDC_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1";
const POW_LS_KEY = "powchain_wallet_v1";

/* ========= LOG ========= */
function log(t){
  const L=document.getElementById("log");
  L.textContent += t + "\\n";
  L.scrollTop=L.scrollHeight;
}

/* ========= PHANTOM / SOLANA ========= */
let solConnection = new solanaWeb3.Connection(SOL_RPC,"confirmed");
let solPubKey = null;

async function connectPhantom(){
  try{
    if(!window.solana || !window.solana.isPhantom){
      document.getElementById("phantomStatus").textContent = "Phantom non détecté.";
      log("⚠ Phantom non détecté.");
      return;
    }
    document.getElementById("phantomStatus").textContent = "Connexion à Phantom…";
    const resp = await window.solana.connect();
    solPubKey = resp.publicKey;
    document.getElementById("phantomStatus").textContent = "Phantom connecté ✅";
    document.getElementById("solanaAddr").textContent = "Adresse Solana : " + solPubKey.toString();
    log("✅ Phantom connecté : " + solPubKey.toString());
    refreshSolanaBalances();
  }catch(e){
    log("⚠ Erreur connexion Phantom : " + e.message);
    document.getElementById("phantomStatus").textContent = "Erreur Phantom.";
  }
}

async function refreshSolanaBalances(){
  if(!solPubKey) return;
  try{
    const lamports = await solConnection.getBalance(solPubKey);
    const sol = lamports / 1e9;

    const usdcMint = new solanaWeb3.PublicKey(USDC_MINT);
    const owner = solPubKey;
    const tokenAccounts = await solConnection.getParsedTokenAccountsByOwner(owner,{mint:usdcMint});
    let usdc = 0;
    for(const acc of tokenAccounts.value){
      const info = acc.account.data.parsed.info;
      const amt = info.tokenAmount;
      if(amt.decimals === 6) usdc += parseFloat(amt.uiAmountString);
    }

    document.getElementById("solanaBalances").textContent =
      "SOL: " + sol.toFixed(4) + " | USDC: " + usdc.toFixed(2);
    log("SOL: " + sol.toFixed(4) + " | USDC: " + usdc.toFixed(2));
  }catch(e){
    log("⚠ Erreur lecture soldes Solana : " + e.message);
  }
}

/* ========= POWCHAIN WS CLIENT ========= */
const ws = new WebSocket("ws://localhost:7001"); // ou wss://bbqfinance.fun:7001
let powState = {priv:"",pub:"",addr:"",nonce:0};

ws.onopen = ()=>{ log("WS POWCHAIN connecté."); };
ws.onclose = ()=>{ log("WS POWCHAIN fermé."); };
ws.onerror = (e)=>{ log("⚠ Erreur WS POWCHAIN."); };

ws.onmessage = (m)=>{
  try{
    const j = JSON.parse(m.data);
    if(j.type === "state" && j.wallet){
      powState.nonce = j.wallet.nonce || 0;
      const w = j.wallet;
      document.getElementById("powBalances").textContent =
        "POW: " + (w.pow||0) + " | USDC POW: " + (w.usdc||0) +
        " | LP: " + (w.lp||0) + " | Stakés: " + (w.staked||0);
    }
    if(j.type === "info" && j.msg) log("ℹ " + j.msg);
    else log("⟹ " + m.data);
  }catch(e){
    log("⟹ " + m.data);
  }
};

function wsSend(o){
  if(ws.readyState === 1) ws.send(JSON.stringify(o));
  else log("⚠ WS non connecté.");
}

/* ========= POWCHAIN WALLET (générer + mémoriser) ========= */
function setPowUiFromState(){
  document.getElementById("powPriv").value = powState.priv || "";
  document.getElementById("powPub").value  = powState.pub || "";
  if(powState.addr){
    document.getElementById("powAddr").textContent = "Adresse POWCHAIN : " + powState.addr;
  }else{
    document.getElementById("powAddr").textContent = "";
  }
}

function savePowWallet(){
  if(!powState.priv || !powState.pub) return;
  localStorage.setItem(POW_LS_KEY, JSON.stringify({priv:powState.priv,pub:powState.pub}));
  document.getElementById("powMemStatus").textContent = "Wallet mémorisé dans ce navigateur ✅";
}

function loadPowWalletFromStorage(autoConnect=true){
  try{
    const raw = localStorage.getItem(POW_LS_KEY);
    if(!raw) return;
    const w = JSON.parse(raw);
    if(!w.priv || !w.pub) return;
    powState.priv = w.priv;
    powState.pub  = w.pub;
    powState.addr = w.pub;
    powState.nonce = 0;
    setPowUiFromState();
    document.getElementById("powMemStatus").textContent = "Wallet POWCHAIN mémorisé trouvé.";
    if(autoConnect){
      log("✅ Wallet POWCHAIN restauré depuis le navigateur : " + powState.addr);
      requestState();
    }
  }catch(e){
    log("⚠ Erreur lecture wallet mémorisé : " + e.message);
  }
}

function forgetPowWallet(){
  localStorage.removeItem(POW_LS_KEY);
  powState = {priv:"",pub:"",addr:"",nonce:0};
  setPowUiFromState();
  document.getElementById("powMemStatus").textContent = "Wallet oublié de ce navigateur.";
  log("ℹ Wallet POWCHAIN supprimé du navigateur.");
}

function generatePowWallet(){
  try{
    const seed = new Uint8Array(32);
    crypto.getRandomValues(seed);
    const kp = nacl.sign.keyPair.fromSeed(seed);
    const priv = bs58.encode(seed);
    const pub  = bs58.encode(kp.publicKey);
    powState.priv = priv;
    powState.pub  = pub;
    powState.addr = pub;
    powState.nonce = 0;
    setPowUiFromState();
    log("✅ Nouveau wallet POWCHAIN généré : " + pub);
    savePowWallet();
    requestState();
  }catch(e){
    log("⚠ Erreur génération wallet : " + e.message);
  }
}

function loadPowWallet(){
  let priv = document.getElementById("powPriv").value.trim();
  let pub  = document.getElementById("powPub").value.trim();
  if(!priv){
    log("⚠ Ajoute une clé privée ou clique sur 'Générer'.");
    return;
  }
  try{
    const seed = bs58.decode(priv);
    const kp = nacl.sign.keyPair.fromSeed(seed);
    if(!pub) pub = bs58.encode(kp.publicKey);
    powState.priv = priv;
    powState.pub  = pub;
    powState.addr = pub;
    powState.nonce = 0;
    setPowUiFromState();
    log("✅ Wallet POWCHAIN connecté : " + powState.addr);
    savePowWallet();
    requestState();
  }catch(e){
    log("⚠ Clé privée invalide : " + e.message);
  }
}

function ensurePow(){
  if(!powState.priv || !powState.pub){
    log("⚠ Connecte ou génère d'abord ton wallet POWCHAIN.");
    return false;
  }
  return true;
}

function requestState(){
  if(!ensurePow()) return;
  wsSend({type:"requestState",pub:powState.pub});
}

/* ========= SIGNATURE OFFICIELLE POWCHAIN ========= */
function signAndSend(type,obj){
  if(!ensurePow()) return;
  const tx = {
    type,
    from: powState.addr,
    pub: powState.pub,
    nonce: (powState.nonce||0) + 1,
    ...obj
  };
  const msg = new TextEncoder().encode(JSON.stringify({
    type: tx.type,
    from: tx.from,
    to: tx.to ?? null,
    amount: tx.amount ?? null,
    token: tx.token ?? null,
    nonce: tx.nonce
  }));
  try{
    const sig = nacl.sign.detached(msg, bs58.decode(powState.priv));
    tx.sig = bs58.encode(sig);
    wsSend(tx);
    powState.nonce = tx.nonce;
    log("✅ TX signée envoyée : " + type);
  }catch(e){
    log("⚠ Erreur signature : " + e.message);
  }
}

/* ========= ACTIONS POWCHAIN ========= */
function sendPOW(){
  const to = document.getElementById("to").value.trim();
  const amount = +document.getElementById("amount").value;
  if(!to || !amount) return log("⚠ Remplis destinataire + montant.");
  signAndSend("transfer",{to,amount});
}

function stake(){
  const amount = +document.getElementById("stakeAmt").value;
  if(!amount) return log("⚠ Montant stake manquant.");
  signAndSend("stake",{amount});
}

function unstake(){
  signAndSend("unstake",{});
}

function addLP(){
  const amount = +document.getElementById("lpAmt").value;
  if(!amount) return log("⚠ Montant LP manquant.");
  signAndSend("addLP",{amount});
}

function removeLP(){
  const amount = +document.getElementById("lpAmt").value;
  if(!amount) return log("⚠ Montant LP manquant.");
  signAndSend("removeLP",{amount});
}

function swap(){
  const amount = +document.getElementById("swapAmt").value;
  if(!amount) return log("⚠ Montant swap manquant.");
  const kind = document.getElementById("swapSel").value;
  signAndSend(kind,{amount});
}

/* ========= AUTO-RESTORE AU CHARGEMENT ========= */
window.addEventListener("load",()=>{
  loadPowWalletFromStorage(true); // auto-connect si wallet mémorisé
});
</script>
</body>
</html>
