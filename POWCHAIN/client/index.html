<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>POWCHAIN Dashboard</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#020b14;color:#8ff;font-family:system-ui;display:flex;flex-direction:column;align-items:center}#wrap{width:100%;max-width:900px;padding:20px}button{background:#001a2a;border:1px solid #09f;color:#8ff;border-radius:6px;padding:8px 14px;font-size:15px;margin:4px 0;cursor:pointer}input{background:#001a2a;border:1px solid #09f;color:#8ff;border-radius:6px;padding:7px;font-size:15px;margin:4px 0;width:100%}#log{height:200px;width:100%;background:#000;border:1px solid #044;padding:8px;overflow:auto;font-size:12px;white-space:pre-wrap}</style></head><body><div id="wrap">
<h2 style="text-align:center;color:#0ff;margin-bottom:10px">💠 POWCHAIN — Dashboard</h2>

<div class="card"><h3>Stats</h3>
<div id="stats">Chargement...</div>
<button onclick="refreshPowStats()">🔄 Rafraîchir</button></div>

<div class="card"><h3>Actions</h3>
<input id="addr" placeholder="Adresse POWCHAIN">
<input id="amount" placeholder="Montant">
<button onclick="mine()">⛏️ Mine</button>
<button onclick="stake()">🔒 Stake</button>
<button onclick="swap()">🔄 Swap POW ⇄ USDC POW</button></div>

<h3>LOGS</h3>
<div id="log"></div></div>

<script>
// 🔥 VPS CORRIGÉ — NE PAS TOUCHER
const API="https://bbqfinance.fun/powchain";
const WS ="wss://bbqfinance.fun/powchain/ws";

function log(m){const l=document.getElementById("log");l.textContent+="\n"+m;l.scrollTop=l.scrollHeight;}

async function refreshPowStats(){
  try{
    let r=await fetch(API+"/stats");
    let j=await r.json();
    document.getElementById("stats").innerText=
      `Height: ${j.height}\nSupply POW: ${j.supplyPOW}\nLP POW: ${j.lpPOW}\nLP USDC: ${j.lpUSDC}`;
    log("✔ Stats OK");
  }catch(e){log("❌ Stats FAIL "+e);}
}

async function mine(){
  let addr=document.getElementById("addr").value;
  let amount=document.getElementById("amount").value;
  if(!addr||!amount) return log("⚠ Adresse + montant requis");
  try{
    let r=await fetch(API+"/tx",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({type:"mine",to:addr,amount:parseFloat(amount)})});
    log("⛏ Demande MINE envoyée");
  }catch(e){log("❌ Mine FAIL "+e);}
}

async function stake(){
  let addr=document.getElementById("addr").value;
  let amount=document.getElementById("amount").value;
  if(!addr||!amount) return log("⚠ Adresse + montant requis");
  try{
    await fetch(API+"/tx",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({type:"stake",to:addr,amount:parseFloat(amount)})});
    log("🔒 Demande STAKE envoyée");
  }catch(e){log("❌ Stake FAIL "+e);}
}

async function swap(){
  let addr=document.getElementById("addr").value;
  let amount=document.getElementById("amount").value;
  if(!addr||!amount) return log("⚠ Adresse + montant requis");
  try{
    await fetch(API+"/tx",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({type:"swap",to:addr,amount:parseFloat(amount)})});
    log("🔁 Demande SWAP envoyée");
  }catch(e){log("❌ Swap FAIL "+e);}
}

// WS live events
let ws=new WebSocket(WS);
ws.onopen = ()=> log("🟢 WS connecté");
ws.onmessage = e => log("📩 "+e.data);
ws.onclose = ()=> log("🔴 WS fermé");
refreshPowStats();
</script></body></html>
