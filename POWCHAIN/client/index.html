<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>BBQ Finance — POWCHAIN Hub</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,sans-serif;
      background:radial-gradient(circle at top,#020617,#020617 55%,#000 100%);
      color:#e5ecff;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }
    #shell{
      width:100%;
      max-width:1200px;
      padding:20px;
      display:grid;
      grid-template-columns:1.1fr 1.1fr;
      grid-template-rows:auto auto;
      gap:18px;
    }
    .card{
      border-radius:18px;
      border:1px solid #1f2937;
      background:radial-gradient(circle at top left,#111827ee,#020617 60%,#000 100%);
      box-shadow:0 0 35px #000c;
      padding:16px 18px;
      position:relative;
      overflow:hidden;
    }
    .card::before{
      content:"";
      position:absolute;
      inset:-40%;
      background:radial-gradient(circle at 0 0,rgba(56,189,248,.18),transparent 55%);
      opacity:.8;
      pointer-events:none;
    }
    .card h2{
      font-size:18px;
      letter-spacing:1px;
      color:#38bdf8;
      text-shadow:0 0 8px #0ea5e9;
      margin-bottom:4px;
    }
    .card h3{
      font-size:14px;
      text-transform:uppercase;
      letter-spacing:.12em;
      color:#a5b4fc;
      margin-bottom:10px;
    }
    .row{display:flex;align-items:center;gap:10px;margin:4px 0}
    .label{font-size:12px;color:#9ca3af}
    .value{font-size:14px;font-weight:600;color:#e5ecff}
    .pill{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid #1f2937;
      background:linear-gradient(90deg,#0f172a,#020617);
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.16em;
      color:#9ca3af;
    }
    .dot-red,.dot-green{
      width:8px;height:8px;border-radius:999px;
      box-shadow:0 0 8px currentColor;
    }
    .dot-red{background:#f97373;color:#f97373}
    .dot-green{background:#4ade80;color:#4ade80}
    button,input{
      font-family:inherit;
      font-size:13px;
      border-radius:999px;
      border:1px solid #1f2937;
      padding:7px 12px;
      background:radial-gradient(circle at top,#0b1120,#020617);
      color:#e5ecff;
      outline:none;
      transition:.15s ease;
    }
    button{
      cursor:pointer;
      text-transform:uppercase;
      letter-spacing:.14em;
      font-size:11px;
    }
    button.primary{
      border-color:#06b6d4;
      box-shadow:0 0 15px #06b6d455;
    }
    button.primary:hover{background:#06b6d4;color:#0b1120}
    button.danger{border-color:#f97373;color:#fecaca}
    button.danger:hover{background:#f97373;color:#111827}
    button.ghost{background:transparent}
    button:disabled{opacity:.45;cursor:not-allowed}
    input{
      min-width:0;
      background:#020617;
    }
    input[readonly]{opacity:.7}
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
    #menu{
      position:fixed;
      top:10px;
      left:50%;
      transform:translateX(-50%);
      display:flex;
      gap:8px;
      z-index:40;
    }
    #menu button{
      background:#020617cc;
      border-radius:999px;
      padding:5px 12px;
      border:1px solid #1f2937;
      font-size:11px;
    }
    #menu button.active{
      border-color:#22d3ee;
      box-shadow:0 0 12px #22d3ee55;
      color:#e0f2fe;
    }
    #pow-live{
      grid-column:2/span 1;
      grid-row:1/span 2;
      min-height:260px;
    }
    #log{
      margin-top:10px;
      background:#020617;
      border-radius:10px;
      border:1px solid #1f2937;
      padding:8px;
      height:220px;
      overflow:auto;
      font-size:11px;
      font-family:ui-monospace,Menlo,Consolas,monospace;
      color:#d1d5db;
      white-space:pre-wrap;
    }
    #log span.t{color:#6ee7b7}
    #log span.err{color:#fca5a5}
    a.quick{color:#a3e635;text-decoration:none;font-size:13px;margin-right:8px}
    a.quick:hover{text-decoration:underline}
    @media(max-width:960px){
      body{align-items:flex-start}
      #shell{margin-top:60px;grid-template-columns:1fr;grid-template-rows:auto}
      #pow-live{grid-column:auto;grid-row:auto}
    }
  </style>
</head>
<body>
<div id="menu">
  <button data-target="bbq">Wallet / Hub</button>
  <button data-target="dex">DEX</button>
  <button data-target="explorer">Explorer</button>
</div>
<div id="shell"></div>
<script>
(()=>{

  const API="https://bbqfinance.fun/powchain";
  const WS ="wss://bbqfinance.fun/powchain/ws";

  let ws=null,wsRetry=0;
  const $=id=>document.getElementById(id);
  const shell=$("shell");

  // ----- Layout HTML -----
  shell.innerHTML=`
    <div id="bbq-card" class="card">
      <h2>BBQ FINANCE</h2>
      <h3>Hub POWCHAIN + Solana</h3>
      <div class="row" style="margin-top:4px">
        <span class="label">Statut POWCHAIN</span>
        <span id="pow-status" class="pill"><span class="dot-red"></span><span>hors ligne</span></span>
        <button id="btn-ping" class="primary">PING</button>
      </div>
      <div class="row">
        <span class="label">Hauteur</span>
        <span class="value mono" id="pow-height">-</span>
      </div>
      <div class="row">
        <span class="label">Supply POW</span>
        <span class="value mono" id="pow-supply">-</span>
      </div>
      <div class="row">
        <span class="label">LP POW</span>
        <span class="value mono" id="pow-lp-pow">-</span>
      </div>
      <div class="row">
        <span class="label">LP USDC</span>
        <span class="value mono" id="pow-lp-usdc">-</span>
      </div>
      <div style="margin-top:14px;font-size:12px;border-top:1px solid #1f2937;padding-top:10px">
        <div style="font-weight:600;color:#bef264;margin-bottom:4px">OUTILS RAPIDES</div>
        <div style="margin-bottom:6px">
          <a class="quick" href="https://dexscreener.com/solana" target="_blank">Dexscreener Solana</a>
          <a class="quick" href="https://dextools.io/app/en/solana" target="_blank">Dextools</a>
          <a class="quick" href="https://pump.fun" target="_blank">Pump.fun</a>
        </div>
        <div>
          <a class="quick" href="https://bbqfinance.fun" target="_blank">BBQFinance.fun</a>
        </div>
        <p style="margin-top:8px;color:#9ca3af;font-size:11px">
          ⚠ Garde ta clé privée POWCHAIN hors ligne. Ce dashboard ne l’envoie jamais sur internet, mais tout ce que tu copies/colles peut être vu par ton OS.
        </p>
      </div>
    </div>

    <div id="solana-card" class="card">
      <h2>SOLANA — PHANTOM</h2>
      <h3>Connexion portefeuille & soldes</h3>
      <div class="row">
        <span class="label">Adresse Solana</span>
      </div>
      <div class="row">
        <input id="sol-addr" class="mono" style="flex:1" readonly placeholder="Non connecté"/>
      </div>
      <div class="row">
        <div class="label" style="min-width:40px">SOL</div>
        <div class="value mono" id="sol-sol">-</div>
      </div>
      <div class="row">
        <div class="label" style="min-width:40px">USDC</div>
        <div class="value mono" id="sol-usdc">-</div>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="btn-phantom" class="primary">CONNECTER PHANTOM</button>
        <button id="btn-sol-refresh" class="ghost">RAFRÂICHIR SOLDES</button>
      </div>
      <div class="row" style="margin-top:8px;font-size:11px;color:#9ca3af">
        Si Phantom ne se connecte pas : vérifie que l’extension est installée sur ce navigateur et que le site bbqfinance.fun est autorisé.
      </div>

      <div id="wallet-card" style="margin-top:18px;border-top:1px solid #1f2937;padding-top:12px">
        <h2 style="font-size:16px;margin-bottom:2px">WALLET POWCHAIN</h2>
        <h3 style="margin-bottom:8px">Générateur local (nacl + base58)</h3>
        <button id="btn-gen-wallet" class="primary" style="margin-bottom:8px">CRÉER UN NOUVEAU WALLET POWCHAIN</button>
        <div class="row">
          <span class="label">Adresse POWCHAIN</span>
        </div>
        <div class="row">
          <input id="pow-addr" class="mono" style="flex:1" readonly placeholder="Clique sur générer"/>
          <button id="btn-copy-addr" class="ghost">COPIER ADRESSE</button>
        </div>
        <div class="row" style="margin-top:10px">
          <span class="label">Clé privée (base58)</span>
        </div>
        <div class="row">
          <input id="pow-priv" class="mono" style="flex:1" type="password" readonly/>
        </div>
        <div class="row" style="margin-top:6px">
          <button id="btn-toggle-priv" class="danger">AFFICHER/MASQUER</button>
          <button id="btn-copy-priv" class="ghost">COPIER CLÉ PRIVÉE</button>
        </div>
        <p style="margin-top:6px;color:#9ca3af;font-size:11px">
          ⚠ Ne partage jamais cette clé. Utilise ce wallet pour jouer/transférer sur ta chaîne POWCHAIN locale uniquement.
        </p>
      </div>
    </div>

    <div id="dex-card" class="card">
      <h2>POWCHAIN LIVE</h2>
      <h3>Blocks & mempool en direct</h3>
      <div class="row" style="margin-bottom:4px">
        <span class="pill" id="ws-pill"><span class="dot-red"></span><span>WS hors ligne</span></span>
        <span class="label" style="margin-left:10px">0 blocs reçus</span>
        <span class="label" style="margin-left:10px">0 TX mempool</span>
      </div>
      <div id="log"></div>
    </div>

    <div id="explorer-card" class="card">
      <h2>SECTION EXPLORER</h2>
      <h3>Accès rapide</h3>
      <p style="font-size:13px;color:#9ca3af;margin-bottom:8px">
        Ici tu pourras brancher ton futur Explorer POWCHAIN complet (liste des blocs, mempool détaillé, comptes, etc.). Pour l’instant, utilise les logs en direct à droite.
      </p>
      <p style="font-size:12px;color:#6b7280">
        ➜ Backend déjà en ligne sur <span class="mono">/powchain</span> (HTTP) et <span class="mono">/powchain/ws</span> (WebSocket) via Nginx.
      </p>
    </div>
  `;

  // ----- Menu scroll -----
  const sections={
    bbq: document.getElementById("bbq-card"),
    dex: document.getElementById("dex-card"),
    explorer: document.getElementById("explorer-card")
  };
  document.querySelectorAll("#menu button").forEach(btn=>{
    btn.onclick=()=>{
      document.querySelectorAll("#menu button").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      const t=btn.getAttribute("data-target");
      sections[t]?.scrollIntoView({behavior:"smooth",block:"start"});
    };
  });
  document.querySelector('#menu button[data-target="bbq"]').classList.add("active");

  // ----- LOG -----
  const logEl=$("log");
  function log(msg,isErr=false){
    const d=new Date();
    const t=`[${d.getHours().toString().padStart(2,"0")} h ${d.getMinutes().toString().padStart(2,"0")} min ${d.getSeconds().toString().padStart(2,"0")} s]`;
    const line=document.createElement("div");
    line.innerHTML=`<span class="t">${t}</span> ${isErr?'<span class="err">'+msg+'</span>':msg}`;
    logEl.appendChild(line);
    logEl.scrollTop=logEl.scrollHeight;
  }

  // ----- STATS POWCHAIN -----
  const statusEl=$("pow-status");
  const hEl=$("pow-height");
  const sEl=$("pow-supply");
  const lpPowEl=$("pow-lp-pow");
  const lpUsdcEl=$("pow-lp-usdc");

  async function refreshPowStats(){
    try{
      const r=await fetch(API+"/stats",{cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      const j=await r.json();
      hEl.textContent=j.height??"-";
      sEl.textContent=(j.supplyPOW??0).toString();
      lpPowEl.textContent=(j.lpPOW??0).toString();
      lpUsdcEl.textContent=(j.lpUSDC??0).toString();
      statusEl.innerHTML='<span class="dot-green"></span><span>en ligne</span>';
      log("Stats POWCHAIN mises à jour");
    }catch(e){
      statusEl.innerHTML='<span class="dot-red"></span><span>hors ligne</span>';
      log("Erreur stats POWCHAIN : "+e.message,true);
    }
  }
  $("btn-ping").onclick=refreshPowStats;

  // ----- WebSocket POWCHAIN -----
  const wsPill=$("ws-pill");
  function setWsState(ok){
    wsPill.innerHTML= ok
      ? '<span class="dot-green"></span><span>WS en ligne</span>'
      : '<span class="dot-red"></span><span>WS hors ligne</span>';
  }
  function connectWS(){
    try{
      if(ws) ws.close();
      setWsState(false);
      log("Connexion WS…");
      ws=new WebSocket(WS);
      ws.onopen=()=>{
        wsRetry=0;
        setWsState(true);
        log("WS connecté");
      };
      ws.onmessage=ev=>{
        log("WS: "+ev.data);
      };
      ws.onerror=err=>{
        log("Erreur WS "+(err?.message||""),true);
      };
      ws.onclose=()=>{
        setWsState(false);
        ws=null;
        wsRetry++;
        const delay=Math.min(30000,3000*wsRetry);
        log("WS fermé, reconnexion dans "+(delay/1000)+"s…",true);
        setTimeout(connectWS,delay);
      };
    }catch(e){
      log("Exception WS : "+e.message,true);
      setTimeout(connectWS,5000);
    }
  }

  // ----- Phantom (lecture simple) -----
  const solAddrEl=$("sol-addr");
  const solSolEl=$("sol-sol");
  const solUsdcEl=$("sol-usdc");
  let solPub=null;

  async function connectPhantom(){
    try{
      const p=window.solana;
      if(!p||!p.isPhantom){
        alert("Phantom n’est pas détecté dans ce navigateur.");
        return;
      }
      const resp=await p.connect();
      solPub=resp.publicKey.toString();
      solAddrEl.value=solPub;
      log("Phantom connecté");
      await refreshSolBalances();
    }catch(e){
      log("Erreur Phantom : "+e.message,true);
    }
  }

  async function refreshSolBalances(){
    if(!solPub){log("Aucune adresse Solana, connecte Phantom d’abord.",true);return;}
    try{
      solSolEl.textContent="~";
      solUsdcEl.textContent="~";
      const endpoint="https://lb.drpc.live/solana/Ah_pmhKMs0qntHMrHyHMTvqg8lcNcRkR8LWNEklbR4ac";
      const bodySOL={jsonrpc:"2.0",id:1,method:"getBalance",params:[solPub]};
      const bodyUSDC={jsonrpc:"2.0",id:1,method:"getTokenAccountsByOwner",params:[solPub,{mint:"EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1"},{encoding:"jsonParsed"}]};
      const [rSol,rUsdc]=await Promise.all([
        fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(bodySOL)}),
        fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(bodyUSDC)})
      ]);
      const jSol=await rSol.json();
      const jUsdc=await rUsdc.json();
      const lamports=jSol.result?.value??0;
      solSolEl.textContent=(lamports/1e9).toFixed(4);
      let amt=0;
      const accs=jUsdc.result?.value||[];
      for(const a of accs){
        const ui=a.account?.data?.parsed?.info?.tokenAmount?.uiAmount||0;
        amt+=ui;
      }
      solUsdcEl.textContent=amt.toFixed(2);
      log("Soldes Solana mis à jour");
    }catch(e){
      log("Erreur soldes Solana : "+e.message,true);
      solSolEl.textContent="-";
      solUsdcEl.textContent="-";
    }
  }

  $("btn-phantom").onclick=connectPhantom;
  $("btn-sol-refresh").onclick=refreshSolBalances;

  // ----- Générateur de wallet POWCHAIN -----
  // encode base58 maison (pour éviter bs58 not defined)
  const ALPHABET="123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
  function base58Encode(buf){
    if(!(buf instanceof Uint8Array)) buf=new Uint8Array(buf);
    let zeros=0, i=0;
    while(i<buf.length && buf[i]===0){zeros++;i++;}
    const b58=[0];
    for(;i<buf.length;i++){
      let carry=buf[i];
      for(let j=0;j<b58.length;j++){
        const x=(b58[j]<<8)+carry;
        b58[j]=x%58;
        carry=(x/58)|0;
      }
      while(carry>0){b58.push(carry%58);carry=(carry/58)|0;}
    }
    let res="";
    for(let k=0;k<zeros;k++) res+=ALPHABET[0];
    for(let q=b58.length-1;q>=0;q--) res+=ALPHABET[b58[q]];
    return res;
  }

  async function genPowWallet(){
    try{
      const kp=window.nacl?window.nacl.sign.keyPair():null;
      if(!kp){alert("Librairie nacl manquante (tweetnacl).");return;}
      const pub58=base58Encode(kp.publicKey);
      const priv58=base58Encode(kp.secretKey);
      $("pow-addr").value=pub58;
      $("pow-priv").value=priv58;
      log("Nouveau wallet POWCHAIN généré.");
    }catch(e){
      alert("Erreur génération wallet : "+e.message);
      log("Erreur génération wallet : "+e.message,true);
    }
  }

  $("btn-gen-wallet").onclick=genPowWallet;
  $("btn-copy-addr").onclick=()=>{const v=$("pow-addr").value;if(!v)return;navigator.clipboard.writeText(v);log("Adresse POWCHAIN copiée.");};
  $("btn-copy-priv").onclick=()=>{const v=$("pow-priv").value;if(!v)return;navigator.clipboard.writeText(v);log("Clé privée POWCHAIN copiée (attention).");};
  $("btn-toggle-priv").onclick=()=>{
    const inp=$("pow-priv");
    inp.type=inp.type==="password"?"text":"password";
  };

  // ----- Init -----
  (function init(){
    // tweetnacl CDN
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/tweetnacl@1.0.3/nacl-fast.min.js";
    s.onload=()=>log("Librairie nacl chargée.");
    document.head.appendChild(s);

    refreshPowStats();
    connectWS();
    setInterval(refreshPowStats,30000);
  })();

})();
</script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"xxxxx"}'></script>
</body>
</html>
