<!doctype html><html lang="fr"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>POWCHAIN — Quantum Dashboard</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' https://unpkg.com; img-src 'self' data:; connect-src 'self' ws: wss: https://api.mainnet-beta.solana.com https://*.drpc.live; font-src 'self'; frame-ancestors 'none';">
<script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
<style>
body{margin:0;background:#020617;color:#c6e2ff;font-family:system-ui;display:flex;height:100vh}
#side{width:230px;background:#030b18;border-right:1px solid #0f2239;padding:12px;box-sizing:border-box}
button{background:#071a2e;border:1px solid #39f;color:#9fe;border-radius:6px;padding:7px;font-size:14px;width:100%;margin:4px 0}
#main{flex:1;padding:16px;overflow-y:auto}
.card{background:#06101e;border:1px solid #12355a;border-radius:8px;padding:12px;margin-bottom:12px}
pre{white-space:pre-wrap;font-size:12px}
</style>
</head><body>

<div id="side">
  <button onclick="connectPhantom()">🔗 Connecter Phantom</button>
  <button onclick="show('wallet')">Wallet</button>
  <button onclick="show('network')">Network</button>
  <button onclick="show('bridge')">Bridge</button>
</div>

<div id="main">
  <div id="wallet" class="card"></div>
  <div id="network" class="card" style="display:none"></div>
  <div id="bridge" class="card" style="display:none"></div>
  <pre id="log" class="card"></pre>
</div>

<script>
const WS = new WebSocket("wss://bbqfinance.fun:2053");
const API = "https://bbqfinance.fun:3000";
let addr,pub,nonce=0;

function log(t){logElm.textContent+="\n"+t;logElm.scrollTop=1e9}
function show(x){["wallet","network","bridge"].forEach(i=>document.getElementById(i).style.display=i===x?"block":"none")}

WS.onmessage=e=>{
  const m=JSON.parse(e.data);
  if(m.t==="state") render(m);
};

async function connectPhantom(){
  try{
    const p=window.solana;
    const r=await p.connect();
    addr=r.publicKey.toString();
    pub=addr;
    nonce=0;
    log("Phantom connecté "+addr);
  }catch(e){log("Erreur Phantom")}
}

async function render(m){
  wallet.innerHTML="Adresse: "+addr+"<br>Nonce: "+nonce;
  network.innerHTML="Height: "+m.height+"<br>Prix POW: "+m.price+"<br>USDC Trésor: "+m.treasury.usdcPow;
  bridge.innerHTML=`Envoyer SOL à la trésorerie<br><small>${m.treasury.addr}</small>`;
}
</script>
</body></html>
