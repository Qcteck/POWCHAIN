<!doctype html><html lang="fr"><head><meta charset="utf-8"/><meta name="viewport"content="width=device-width,initial-scale=1"/><title>POWCHAIN — Dashboard</title><style>body{margin:0;background:#020b14;color:#8ff;font-family:system-ui;display:flex;height:100vh;overflow:hidden}#side{width:270px;background:#000a;border-right:1px solid #044;padding:14px;box-sizing:border-box}#main{flex:1;position:relative;padding:14px;box-sizing:border-box}h2{margin:0 0 12px;color:#0ff;text-shadow:0 0 8px #09f}button,input{background:#00111d;border:1px solid #09f;color:#8ff;border-radius:6px;padding:7px;margin:4px 0;font-size:14px;width:100%}#log{position:absolute;bottom:0;left:0;width:100%;height:200px;background:#0009;border-top:1px solid #044;overflow:auto;font-size:12px;padding:6px;box-sizing:border-box;white-space:pre-wrap}</style></head><body><div id="side"><h2>POWCHAIN</h2><button onclick="connect()">🔌 Connect Wallet</button><button onclick="mine()">⛏️ Mine Block</button><button onclick="stake()">💠 Stake POW</button><button onclick="swap()">💱 Swap POW⇄USDC</button><div style="margin-top:14px">Wallet:<div id="addr"style="font-size:12px;word-wrap:break-word;color:#0ff"></div></div><div style="margin-top:14px">Balances:<div id="bal" style="font-size:13px"></div></div></div><div id="main"><canvas id="chart" width="900" height="300" style="background:#001d2f;border-radius:8px;border:1px solid #033"></canvas><div id="log"></div></div><script>const API="https://bbqfinance.fun/powchain";const WS="wss://bbqfinance.fun/powchain/ws";let ws,wallet=null;const log=t=>{const e=document.getElementById("log");e.textContent+=t+"\n";e.scrollTop=e.scrollHeight};async function connect(){wallet="WALLET_"+Math.random().toString(36).slice(2);document.getElementById("addr").textContent=wallet;log("Wallet connecté ✔️")}async function refresh(){if(!wallet)return;let r=await fetch(API+"/balances/"+wallet).then(r=>r.json());document.getElementById("bal").textContent="POW: "+r.pow+" | USDC: "+r.usdc}async function mine(){if(!wallet)return log("❌ Connect wallet");let r=await fetch(API+"/mine",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({wallet})}).then(r=>r.json());log("⛏️ Mine: "+JSON.stringify(r));refresh()}async function stake(){if(!wallet)return log("❌ Connect wallet");let r=await fetch(API+"/stake",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({wallet,amount:1000})}).then(r=>r.json());log("💠 Stake: "+JSON.stringify(r));refresh()}async function swap(){if(!wallet)return log("❌ Connect wallet");let r=await fetch(API+"/swap",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({wallet,dir:"POW→USDC",amount:500})}).then(r=>r.json());log("💱 Swap: "+JSON.stringify(r));refresh()}function wsStart(){ws=new WebSocket(WS);ws.onopen=()=>log("WS connecté 🔵");ws.onmessage=e=>log("📡 "+e.data);ws.onclose=()=>setTimeout(wsStart,2000)}wsStart();setInterval(refresh,2000);</script></body></html>
