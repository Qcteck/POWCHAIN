<script>
// ==== CONSTANTES GLOBALes ====
const SOL_RPC="https://lb.drpc.live/solana/Ah_pmhKMs0qntHMrHyHMTvqg8lcNcRkR8LWNEklbR4ac";
const USDC_MINT="EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1";

// ==== RÉFÉRENCES DOM ====
const logEl=document.getElementById("consoleLog");
const wsTag=document.getElementById("wsTag");
const solStatusEl=document.getElementById("solanaStatus");
const solAddrEl=document.getElementById("solanaAddr");
const solBalEl=document.getElementById("solanaBalances");
const powPrivInput=document.getElementById("powPriv");
const powAddrInput=document.getElementById("powAddr");
const powWalletStatus=document.getElementById("powWalletStatus");
const supplyPowEl=document.getElementById("supplyPow");
const supplyLpEl=document.getElementById("supplyLp");
const powPriceEl=document.getElementById("powPrice");
const blockHeightEl=document.getElementById("blockHeight");
const lastProducerEl=document.getElementById("lastProducer");
const lastHashEl=document.getElementById("lastHash");
const lastTimeEl=document.getElementById("lastTime");
const mempoolSizeEl=document.getElementById("mempoolSize");
const recentBlocksEl=document.getElementById("recentBlocks");
const recentTxEl=document.getElementById("recentTx");
const searchWalletInput=document.getElementById("searchWallet");
const searchWalletResult=document.getElementById("searchWalletResult");
const searchTxInput=document.getElementById("searchTx");
const searchTxResult=document.getElementById("searchTxResult");
const bridgeSolInput=document.getElementById("bridgeSolAmount");
const bridgeStatus=document.getElementById("bridgeStatus");
const swapFromSelect=document.getElementById("swapFrom");
const swapToSelect=document.getElementById("swapTo");
const swapAmountInput=document.getElementById("swapAmount");
const swapStatus=document.getElementById("swapStatus");

// ==== UTIL LOG ====
function log(msg){
  if(!logEl) return;
  logEl.textContent+=msg+"\n";
  logEl.scrollTop=logEl.scrollHeight;
}

// ==== PHANTOM / SOLANA ==== 
let solConnection=new solanaWeb3.Connection(SOL_RPC,"confirmed");
let solPubKey=null;

async function connectPhantom(){
  try{
    if(!window.solana || !window.solana.isPhantom){
      log("⚠️ Phantom non détecté");
      solStatusEl.textContent="Phantom manquant";
      return;
    }
    const resp=await window.solana.connect();
    solPubKey=resp.publicKey;
    solStatusEl.textContent="Phantom connecté ✅";
    solAddrEl.textContent="Adresse Solana : "+solPubKey.toBase58();
    await refreshSolanaBalances();
  }catch(e){
    log("⚠️ Erreur Phantom : "+e.message);
    solStatusEl.textContent="Erreur Phantom";
  }
}

async function refreshSolanaBalances(){
  if(!solPubKey) return;
  try{
    const lamports=await solConnection.getBalance(solPubKey);
    const sol=lamports/1e9;

    const usdcMint=new solanaWeb3.PublicKey(USDC_MINT);
    const t=await solConnection.getParsedTokenAccountsByOwner(solPubKey,{mint:usdcMint});
    let usdc=0;
    for(const a of t.value){
      const d=a.account.data.parsed.info.tokenAmount;
      usdc+=parseFloat(d.uiAmountString);
    }
    solBalEl.textContent="SOL : "+sol.toFixed(4)+"  |  USDC : "+usdc.toFixed(2);
  }catch(e){
    log("⚠️ Erreur soldes Solana : "+e.message);
  }
}

// ==== WALLET POWCHAIN (nacl + bs58) ====
let powWallet=null; // {priv,pub}
let powState=null;  // dernier état wallet renvoyé par le serveur

function savePowToStorage(){
  if(powWallet) localStorage.setItem("pow_priv",powWallet.priv);
}
function loadPowFromStorage(){
  const priv=localStorage.getItem("pow_priv");
  if(!priv){
    log("ℹ️ Aucun wallet POWCHAIN local trouvé");
    return;
  }
  try{
    setPowWalletFromPriv(priv);
    log("ℹ️ Wallet POWCHAIN restauré depuis le stockage");
  }catch(e){
    log("⚠️ Erreur chargement wallet : "+e.message);
  }
}

function setPowWalletFromPriv(priv){
  if(!window.bs58 || !window.nacl) throw new Error("libs bs58/nacl manquantes");
  const bytes=bs58.decode(priv);
  if(bytes.length!==64) throw new Error("Clé privée invalide (64 bytes attendus)");
  const pub=bs58.encode(bytes.slice(32));
  powWallet={priv,pub};
  if(powPrivInput) powPrivInput.value=priv;
  if(powAddrInput) powAddrInput.value=pub;
  if(powWalletStatus) powWalletStatus.textContent="Wallet POWCHAIN chargé ✅";
  savePowToStorage();
  syncWallet();
}

function applyPowPriv(){
  const priv=(powPrivInput.value||"").trim();
  if(!priv){
    if(powWalletStatus) powWalletStatus.textContent="Adresse wallet vide";
    return;
  }
  try{
    setPowWalletFromPriv(priv);
  }catch(e){
    log("⚠️ Erreur chargement wallet : "+e.message);
  }
}

function generatePowWallet(){
  try{
    if(!window.bs58 || !window.nacl) throw new Error("libs bs58/nacl manquantes");
    const kp=nacl.sign.keyPair();
    const priv=bs58.encode(kp.secretKey);
    const pub=bs58.encode(kp.publicKey);
    powWallet={priv,pub};
    if(powPrivInput) powPrivInput.value=priv;
    if(powAddrInput) powAddrInput.value=pub;
    if(powWalletStatus) powWalletStatus.textContent="Wallet POWCHAIN généré ✅";
    savePowToStorage();
    syncWallet();
  }catch(e){
    log("Erreur génération wallet : "+e.message);
  }
}

// ==== WS POWCHAIN ====
let ws=null;

// connexion dynamique : ws://host/ws ou wss://host/ws
function wsConnect(){
  const proto=(location.protocol==="https:")?"wss://":"ws://";
  const url=proto+location.host+"/ws";
  log("Connexion WS -> "+url);

  ws=new WebSocket(url);

  ws.onopen=()=>{
    wsTag.textContent="WS OK";
    wsTag.style.borderColor="#53f3c3";
    log("🟢 WS POWCHAIN connecté");
    ws.send(JSON.stringify({type:"ping"}));
    if(powWallet) syncWallet();
  };

  ws.onclose=()=>{
    wsTag.textContent="WS…";
    wsTag.style.borderColor="#ff9acb";
    log("WS fermé, reconnexion...");
    setTimeout(wsConnect,2000);
  };

  ws.onmessage=e=>{
    try{
      const m=JSON.parse(e.data);
      if(m.type==="state") handleGlobalState(m.state);
      if(m.type==="wallet") updatePowWallet(m);
      if(m.type==="wallet_info") showWalletInfo(m);
      if(m.type==="tx_info") showTxInfo(m);
      if(m.type==="tx") addTx(m.tx);
      if(m.type==="block") addBlock(m.block);
      if(m.type==="swap_ok"){swapStatus.textContent="✅ Swap ok : "+m.amountOut+" "+m.to;}
      if(m.type==="swap_error"){swapStatus.textContent="❌ "+m.msg;}
      if(m.type==="bridge_ok"){bridgeStatus.textContent="✅ Bridge ok";}
      if(m.type==="bridge_error"){bridgeStatus.textContent="❌ "+m.msg;}
    }catch(err){}
  };
}

function ensureWS(){
  if(!ws || ws.readyState!==1){
    log("⚠️ WS non prêt");
    return false;
  }
  return true;
}
function ensurePowWallet(){
  if(!powWallet){
    log("⚠️ Crée ou charge un wallet POWCHAIN d'abord");
    return false;
  }
  return true;
}

function syncWallet(){
  if(!ensureWS()||!ensurePowWallet())return;
  ws.send(JSON.stringify({type:"wallet_sync",addr:powWallet.pub}));
}

// ==== SIGN + SEND TX ====
function signSend(type,obj){
  if(!ensureWS()||!ensurePowWallet())return;
  const nonce=(powState && powState.wallet && typeof powState.wallet.nonce==="number")
    ? powState.wallet.nonce+1
    : Date.now();

  const tx={type,from:powWallet.pub,nonce,...obj};

  const enc=new TextEncoder();
  const msg=enc.encode(JSON.stringify({
    type:tx.type,
    from:tx.from,
    to:tx.to||null,
    amount:tx.amount||null,
    token:tx.token||null,
    nonce:tx.nonce
  }));

  const sig=nacl.sign.detached(msg,bs58.decode(powWallet.priv));
  tx.sig=bs58.encode(sig);

  ws.send(JSON.stringify({type:"tx",tx}));
  log("TX signée "+type);
}

// ==== EXPLORER + GRAPHIQUE ====
let chart=null;
let chartLabels=[];
let chartPow=[];
let chartLp=[];
let chartPrice=[];

function initChart(){
  const canvas=document.getElementById("supplyChart");
  if(!canvas) return;
  const ctx=canvas.getContext("2d");
  chart=new Chart(ctx,{
    type:"line",
    data:{
      labels:chartLabels,
      datasets:[
        {label:"Supply POW",data:chartPow,borderWidth:2,tension:0.25},
        {label:"Supply LP POW",data:chartLp,borderWidth:2,tension:0.25},
        {label:"Prix POW (USDC POW)",data:chartPrice,borderWidth:2,tension:0.25}
      ]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{legend:{labels:{color:"#ffe"}}},
      scales:{
        x:{ticks:{color:"#ccc"},grid:{display:false}},
        y:{ticks:{color:"#ccc"},grid:{color:"#0004"}}
      }
    }
  });
}

function handleGlobalState(s){
  if(!s) return;
  // header stats
  if(supplyPowEl) supplyPowEl.textContent=s.supplyPOW.toFixed(0);
  if(supplyLpEl) supplyLpEl.textContent=s.supplyLP.toFixed(0);
  if(powPriceEl) powPriceEl.textContent=s.pricePOW.toFixed(6);
  if(blockHeightEl) blockHeightEl.textContent=s.height;
  if(lastProducerEl) lastProducerEl.textContent=s.lastProducer||"";
  if(lastHashEl) lastHashEl.textContent=s.lastHash||"";
  if(lastTimeEl) lastTimeEl.textContent=s.lastTime||"";
  if(mempoolSizeEl) mempoolSizeEl.textContent=s.mempoolSize||0;

  // graph
  const label=new Date().toLocaleTimeString();
  chartLabels.push(label);
  chartPow.push(s.supplyPOW);
  chartLp.push(s.supplyLP);
  chartPrice.push(s.pricePOW);
  if(chartLabels.length>60){
    chartLabels.shift();chartPow.shift();chartLp.shift();chartPrice.shift();
  }
  if(chart) chart.update();

  // blocs récents
  if(Array.isArray(s.recentBlocks) && recentBlocksEl){
    recentBlocksEl.innerHTML="";
    s.recentBlocks.forEach(b=>{
      const li=document.createElement("div");
      li.className="blockRow";
      li.textContent="#"+b.height+" — "+b.hash.slice(0,16)+"… — "+b.producer;
      recentBlocksEl.appendChild(li);
    });
  }

  // tx récentes
  if(Array.isArray(s.recentTx) && recentTxEl){
    recentTxEl.innerHTML="";
    s.recentTx.forEach(t=>{
      const li=document.createElement("div");
      li.className="txRow";
      li.textContent=t.id.slice(0,10)+"… "+t.type+" "+(t.amount||0)+" "+(t.token||"");
      recentTxEl.appendChild(li);
    });
  }
}

function addBlock(b){
  // le serveur envoie déjà l'état complet dans "state", donc ici optionnel
  log("Nouveau bloc "+b.height+" par "+b.producer);
}
function addTx(t){
  log("TX "+t.type+" "+(t.amount||0)+" "+(t.token||""));
}

// MAJ infos wallet locale (réponse serveur)
function updatePowWallet(m){
  powState=m;
  if(!m.wallet)return;
  if(document.getElementById("powBalance")){
    document.getElementById("powBalance").textContent=
      (m.wallet.pow||0).toFixed(4)+" POW";
  }
  if(document.getElementById("usdcPowBalance")){
    document.getElementById("usdcPowBalance").textContent=
      (m.wallet.usdc||0).toFixed(4)+" USDC POW";
  }
}

// ==== RECHERCHE WALLET / TX ====
function searchWallet(){
  if(!ensureWS())return;
  const addr=(searchWalletInput.value||"").trim();
  if(!addr)return;
  ws.send(JSON.stringify({type:"wallet_info",addr}));
  searchWalletResult.textContent="Recherche en cours…";
}
function showWalletInfo(m){
  if(!searchWalletResult)return;
  if(!m.info){
    searchWalletResult.textContent="Wallet introuvable";
    return;
  }
  searchWalletResult.textContent=
    "POW: "+(m.info.pow||0)+" | USDC POW: "+(m.info.usdc||0)+" | nonce: "+m.info.nonce;
}

function searchTx(){
  if(!ensureWS())return;
  const id=(searchTxInput.value||"").trim();
  if(!id)return;
  ws.send(JSON.stringify({type:"tx_info",id}));
  searchTxResult.textContent="Recherche en cours…";
}
function showTxInfo(m){
  if(!searchTxResult)return;
  if(!m.info){
    searchTxResult.textContent="TX introuvable";
    return;
  }
  const t=m.info;
  searchTxResult.textContent=
    t.id+" — "+t.type+" "+(t.amount||0)+" "+(t.token||"")+" de "+t.from+" vers "+(t.to||"-");
}

// ==== BRIDGE & SWAP ====
function doBridgeSol(){
  if(!ensureWS()||!ensurePowWallet())return;
  const amt=parseFloat(bridgeSolInput.value||"0");
  if(!amt||amt<=0){
    bridgeStatus.textContent="Montant invalide";
    return;
  }
  bridgeStatus.textContent="Bridge en cours…";
  ws.send(JSON.stringify({type:"bridge_sol_powchain",amount:amt,addr:powWallet.pub}));
}

function doSwap(){
  if(!ensureWS()||!ensurePowWallet())return;
  const from=swapFromSelect.value;
  const to=swapToSelect.value;
  const amt=parseFloat(swapAmountInput.value||"0");
  if(from===to){
    swapStatus.textContent="Choisis 2 tokens différents";
    return;
  }
  if(!amt||amt<=0){
    swapStatus.textContent="Montant invalide";
    return;
  }
  swapStatus.textContent="Swap en cours…";
  signSend("swap",{fromToken:from,toToken:to,amount:amt});
}

// ==== HOOKS BOUTONS ====
document.getElementById("btnConnectPhantom")?.addEventListener("click",connectPhantom);
document.getElementById("btnRefreshSol")?.addEventListener("click",refreshSolanaBalances);
document.getElementById("btnGeneratePow")?.addEventListener("click",generatePowWallet);
document.getElementById("btnApplyPow")?.addEventListener("click",applyPowPriv);
document.getElementById("btnBridgeSol")?.addEventListener("click",doBridgeSol);
document.getElementById("btnSwap")?.addEventListener("click",doSwap);
document.getElementById("btnSearchWallet")?.addEventListener("click",searchWallet);
document.getElementById("btnSearchTx")?.addEventListener("click",searchTx);

// ==== INIT ====
window.addEventListener("load",()=>{
  initChart();
  loadPowFromStorage();
  wsConnect();
});
</script>
