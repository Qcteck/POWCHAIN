<!doctype html><html lang="fr"><head>
<meta charset="utf-8"/><meta name="viewport"content="width=device-width,initial-scale=1"/>
<title>POWCHAIN — Pod of Whales</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap"rel="stylesheet">
<script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tweetnacl@1.0.3/nacl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bs58@5.0.0/dist/bs58.min.js"></script>

<style>
:root{--bg:#080015;--accent:#ff5b5b;--accent-soft:#ffb36b;--accent-cyan:#4cf5ff;--text:#ffeef9;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Rajdhani";background:#080015;color:var(--text);overflow-x:hidden}
#shell{padding:18px;}
h2{letter-spacing:.15em;color:var(--accent-soft);text-transform:uppercase;font-size:14px;margin-bottom:6px}
.card{background:#200016dd;border:1px solid #522848;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 0 26px #000}
button{background:linear-gradient(90deg,#ff944d,#ff5b5b);border:1px solid #ffb36b;border-radius:999px;padding:5px 15px;font-size:13px;cursor:pointer}
label,input,textarea,select{font-size:12px;color:var(--text)}
input,textarea,select{background:#110015;border:1px solid #522848;border-radius:8px;padding:6px;width:100%}
#powChart{width:100%!important;height:280px!important} /* CHART FIX */
#blocksList{max-height:310px;overflow-y:auto;font-size:12px} /* EXPLORER AGRANDI */
#log{max-height:220px;overflow-y:auto;font-size:11px;background:#0b000d;border:1px solid #522848;padding:8px;border-radius:10px;white-space:pre-wrap}
.meta3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:4px 10px;font-size:12px}
.meta3 span.v{color:var(--accent-cyan)}
#solanaBalance{font-size:12px;color:#4cf5ff}
</style>
</head><body><div id="shell">

<h2>POWCHAIN — Pod of Whales</h2>
<div class="card">
  <button onclick="connectPhantom()">Connect Phantom</button>
  <div id="solanaAddr"></div>
  <div id="solanaBalance">SOL : - | USDC : -</div>
</div>

<div class="card">
  <h2>Explorer POWCHAIN</h2>
  <div class="meta3">
    <div>Bloc <span class="v" id="bHeight">-</span></div>
    <div>Producteur <span class="v" id="bProducer">-</span></div>
    <div>Supply POW <span class="v" id="bSupplyPow">-</span></div>
    <div>Supply LP <span class="v" id="bSupplyLp">-</span></div>
    <div>Prix POW <span class="v" id="bPrice">-</span></div>
    <div>Mempool <span class="v" id="bMempool">-</span></div>
  </div>
</div>

<div class="card"><canvas id="powChart"></canvas></div>

<div class="card">
  <h2>Blocs récents</h2>
  <div id="blocksList"></div>
</div>

<div class="card">
  <h2>Wallet POWCHAIN</h2>
  <textarea id="powPriv" placeholder="clé privée POWCHAIN (bs58)"></textarea>
  <button onclick="genWallet()">Générer</button>
  <button onclick="loadWallet()">Charger</button>
  <button onclick="saveWallet()">Sauver local</button>
  <button onclick="loadWalletLocal()">Charger local</button>
  <div id="powWalletState"></div>
  <div id="powAddr"></div>
  <div id="powBalances"></div>
</div>

<div class="card">
  <h2>Actions</h2>
  <input id="txTo" placeholder="Destinataire POWCHAIN (pub)"/>
  <input id="txAmount" type="number" placeholder="Montant POW"/>
  <button onclick="sendPow()">Envoyer POW</button>
</div>

<div class="card">
  <h2>Console</h2><div id="log"></div>
</div>
</div>

<script>
/*=================== LOG ===================*/
function log(m){const L=document.getElementById("log");L.textContent+="\n"+m;L.scrollTop=L.scrollHeight}

/*=================== PHANTOM ===================*/
let solani=null,solPub=null
const RPC="https://lb.drpc.live/solana/Ah_pmhKMs0qntHMrHyHMTvqg8lcNcRkR8LWNEklbR4ac"
const conn=new solanaWeb3.Connection(RPC,"confirmed")
async function connectPhantom(){
  try{
    const r=await window.solana.connect();solPub=r.publicKey
    document.getElementById("solanaAddr").textContent="Solana : "+solPub.toBase58()
    refreshBalances()
  }catch(e){log("Phantom erreur")}
}
/* FIX SOL + USDC */
async function refreshBalances(){
  if(!solPub)return
  try{
    const sol=(await conn.getBalance(solPub))/solanaWeb3.LAMPORTS_PER_SOL
    const tok=await conn.getParsedTokenAccountsByOwner(solPub,{programId:new solanaWeb3.PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA")})
    let usdc=0
    tok.value.forEach(t=>{
      const info=t.account.data.parsed.info
      if(info.mint==="EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1")
        usdc+=parseFloat(info.tokenAmount.amount)/(10**info.tokenAmount.decimals)
    })
    document.getElementById("solanaBalance").textContent=`SOL : ${sol.toFixed(4)} | USDC : ${usdc.toFixed(2)}`
  }catch(e){log("Erreur sol/usdc")}
}

/*=================== WALLET POWCHAIN — FIX ENCODE/DECODE ===================*/
let powPub=null,powPriv=null,powAddr=null,powNonce=0
function genWallet(){
  const kp=nacl.sign.keyPair()
  powPriv=bs58.encode(kp.secretKey)
  powPub=bs58.encode(kp.publicKey)
  powAddr=powPub
  document.getElementById("powPriv").value=powPriv
  updatePowWallet()
  log("Wallet généré")
}
function loadWallet(){
  try{
    powPriv=document.getElementById("powPriv").value.trim()
    const sec=bs58.decode(powPriv)
    powPub=bs58.encode(nacl.sign.keyPair.fromSecretKey(sec).publicKey)
    powAddr=powPub
    updatePowWallet()
    requestState()
  }catch(e){log("Erreur wallet")}
}
function saveWallet(){localStorage.setItem("pow_priv",powPriv);log("Sauvé local")}
function loadWalletLocal(){document.getElementById("powPriv").value=localStorage.getItem("pow_priv")||"";loadWallet()}
function updatePowWallet(){
  document.getElementById("powWalletState").textContent=powAddr?"Wallet chargé":"Wallet non chargé"
  document.getElementById("powAddr").textContent=powAddr||""
}

/*=================== WS ===================*/
let ws
function startWS(){
  ws=new WebSocket((location.protocol==="https:"?"wss":"ws")+"://"+location.host+"/ws")
  ws.onopen=()=>{log("WS ok");ws.send(JSON.stringify({type:"explorer"}));requestState()}
  ws.onmessage=e=>{
    const m=JSON.parse(e.data)
    if(m.type==="explorer")updateExplorer(m.data)
    if(m.type==="state")updateWalletState(m.wallet)
  }
  ws.onclose=()=>setTimeout(startWS,2000)
}
startWS()

/*=================== EXPLORER + CHART ===================*/
const ctx=document.getElementById("powChart")
const dChart={labels:[],datasets:[
  {label:"Supply POW",data:[],borderColor:"#ff5b5b"},
  {label:"Supply LP",data:[],borderColor:"#ffb36b"},
  {label:"Prix POW",data:[],borderColor:"#4cf5ff",yAxisID:"y1"}
]}
const chart=new Chart(ctx,{type:"line",data:dChart,options:{
  responsive:true,maintainAspectRatio:false,scales:{y:{},y1:{position:"right"}}
}})
function updateExplorer(d){
  document.getElementById("bHeight").textContent=d.height
  document.getElementById("bProducer").textContent=d.producer
  document.getElementById("bSupplyPow").textContent=d.supplyPow
  document.getElementById("bSupplyLp").textContent=d.supplyLpPow
  document.getElementById("bPrice").textContent=d.pricePow.toFixed(6)
  document.getElementById("bMempool").textContent=d.mempool.length

  /* CHART FIX taille MAX 40 points */
  const t=new Date(d.timestamp).toLocaleTimeString()
  dChart.labels.push(t)
  dChart.datasets[0].data.push(d.supplyPow)
  dChart.datasets[1].data.push(d.supplyLpPow)
  dChart.datasets[2].data.push(d.pricePow)
  if(dChart.labels.length>40){
    dChart.labels.shift()
    dChart.datasets.forEach(s=>s.data.shift())
  }
  chart.update()

  /* Explorer bloc élargi */
  const b=document.getElementById("blocksList")
  b.innerHTML=`<div>Bloc ${d.height} — ${d.producer} — Prix ${d.pricePow.toFixed(6)}</div>`+b.innerHTML
}

/*=================== STATE + TX ===================*/
function updateWalletState(w){
  if(!w)return
  powNonce=w.nonce
  document.getElementById("powBalances").textContent=`POW ${w.pow} • USDC ${w.usdc} • LP ${w.lp} • Staked ${w.staked}`
}
function signSend(type,obj){
  try{
    const tx={type,from:powAddr,pub:powPub,nonce:powNonce+1,...obj}
    const msg=new TextEncoder().encode(JSON.stringify({type:tx.type,from:tx.from,to:tx.to??null,amount:tx.amount??null,nonce:tx.nonce}))
    tx.sig=bs58.encode(nacl.sign.detached(msg,bs58.decode(powPriv)))
    ws.send(JSON.stringify(tx))
    log("TX "+type)
  }catch(e){log("TX error")}
}
function sendPow(){
  signSend("transfer",{to:document.getElementById("txTo").value,amount:parseFloat(document.getElementById("txAmount").value)})
}
function requestState(){if(powAddr)ws.send(JSON.stringify({type:"requestState",pub:powAddr}))}
</script>
</body></html>
