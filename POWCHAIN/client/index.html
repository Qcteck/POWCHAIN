<!doctype html><html lang="fr"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>POWCHAIN — Dashboard D</title>
<style>
body{margin:0;background:#05070b;color:#d5dade;font-family:system-ui;overflow-x:hidden}
#wrap{max-width:900px;margin:18px auto;padding:20px;background:#0b111c;border:1px solid #1c2430;border-radius:14px;box-shadow:0 0 25px #000}
h2{text-align:center;margin:5px;color:#6fd3ff;text-shadow:0 0 6px #268bff}
button,input{background:#06121d;border:1px solid #147aaa;border-radius:6px;color:#d9e9ff;padding:8px;margin:4px 0;font-size:14px}
#log{white-space:pre-wrap;background:#0007;margin-top:12px;padding:8px;border-radius:8px;font-size:13px;height:190px;overflow-y:auto}
.row{display:flex;gap:8px;flex-wrap:wrap}
.card{flex:1 1 260px;background:#111825;border:1px solid #1c2f3c;padding:10px;border-radius:8px}
</style>
</head><body>
<div id="wrap">
<h2>POWCHAIN — Version D</h2>

<div class="row">
<div class="card">
<b>🌍 Blockchain</b><br>
Height: <span id="height">?</span><br>
Supply POW: <span id="supply">?</span><br>
LP POW: <span id="lpPOW">?</span><br>
LP USDC: <span id="lpUSDC">?</span><br>
</div>

<div class="card">
<b>👛 Wallet</b><br>
Pub:<br><input id="pub" style="width:100%"/><br>
Priv:<br><input id="priv" style="width:100%"/><br>
<button onclick="loadWallet()">Load Wallet</button><br>
POW: <span id="wpow">?</span><br>
USDC: <span id="wusdc">?</span><br>
STAKE: <span id="wst">?</span>
</div>
</div>

<div class="card">
<b>⚡ Send TX</b><br>
<select id="type">
<option value="transfer">transfer</option>
<option value="stake">stake</option>
<option value="unstake">unstake</option>
<option value="lp_add">lp_add</option>
<option value="lp_remove">lp_remove</option>
<option value="bridge_sol_in">bridge_sol_in</option>
</select><br>
To:<input id="to" style="width:100%"/><br>
Token:<select id="token"><option value="pow">pow</option><option value="usdc">usdc</option></select><br>
Amount:<input id="amt" type="number" style="width:100%"/><br>
<button onclick="sendTx()">🚀 Send</button>
</div>

<pre id="log"></pre>
</div>

<script src="https://cdn.jsdelivr.net/npm/tweetnacl@1.0.3/nacl-fast.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bs58@5.0.0/dist/bs58.min.js"></script>
<script>
const API="https://bbqfinance.fun",WS="wss://bbqfinance.fun/ws";
const enc=t=>new TextEncoder().encode(JSON.stringify(t));
let ws,nonce=0,wallet=null;

function L(x){log.textContent+=x+"\n";log.scrollTop=log.scrollHeight;}

function refreshStats(){
fetch(API+"/stats").then(r=>r.json()).then(j=>{
height.textContent=j.height;
supply.textContent=j.supplyPOW;
lpPOW.textContent=j.lpPOW;
lpUSDC.textContent=j.lpUSDC;
});
}

function loadWallet(){
try{
wallet={pub:pub.value.trim(),priv:priv.value.trim()};
refreshWallet();
L("Wallet loaded");
}catch{L("❌ mauvais wallet");}
}

function refreshWallet(){
fetch(API+"/wallet/"+wallet.pub).then(r=>r.json()).then(w=>{
wpow.textContent=w.pow;
wusdc.textContent=w.usdc;
wst.textContent=w.staked;
nonce=w.nonce;
});
}

function connectWS(){
ws=new WebSocket(WS);
ws.onopen=()=>L("WS Connected");
ws.onmessage=e=>{
const m=JSON.parse(e.data);
if(m.height)height.textContent=m.height;
};
ws.onclose=()=>setTimeout(connectWS,2000);
}
connectWS();

function signTx(tx){
const m=enc({type:tx.type,from:tx.from,to:tx.to??null,amount:tx.amount??null,token:tx.token??null,nonce:tx.nonce});
const sig=nacl.sign.detached(m,bs58.decode(wallet.priv));
tx.sig=bs58.encode(sig);
return tx;
}

function sendTx(){
if(!wallet)return L("❌ load wallet first");
let tx={type:type.value,from:wallet.pub,to:to.value.trim(),token:token.value,amount:parseInt(amt.value),nonce:nonce+1,pub:wallet.pub};
tx=signTx(tx);
fetch(API+"/tx",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(tx)})
.then(r=>r.json()).then(j=>{
if(j.ok){L("✅ TX OK");nonce++;refreshWallet();}
else L("❌ TX FAIL "+JSON.stringify(j));
});
}

setInterval(refreshStats,1000);
setInterval(()=>wallet&&refreshWallet(),2000);
</script>
</body></html>
