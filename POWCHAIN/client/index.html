<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>POWCHAIN — Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bs58@5.0.0/dist/bs58.min.js"></script>
<script src="https://bundle.run/buffer@6.0.3"></script>
<script>window.Buffer = buffer.Buffer;</script>
<style>
body{margin:0;background:radial-gradient(circle at top,#300,#120013);color:#ffdede;font-family:system-ui;overflow-x:hidden}
h2{margin:0 0 6px;text-shadow:0 0 6px #f44}
.panel{border:1px solid #992;color:#ffdede;background:#2c0019cc;padding:14px;border-radius:10px;margin:12px}
.btn{background:#ff0047;border:1px solid #ff75b5;border-radius:6px;color:#fff;padding:9px;cursor:pointer}
input{background:#1c0012;border:1px solid #883;color:#ffdede;padding:7px;border-radius:6px;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
#console{height:210px;overflow-y:auto;background:#18000ecc;padding:10px;font-size:13px;border-radius:8px;white-space:pre-wrap}
</style>
</head><body>

<div class="panel"><h2>POWCHAIN — WALLET</h2>
<button class="btn" onclick="connectPhantom()">🔌 Connect Phantom</button>
<div id="solStatus"></div>
<div id="solBalances"></div><br>
<input id="powPriv" placeholder="Clé privée POWCHAIN (laisser vide pour générer)">
<button class="btn" onclick="genPOW()">⚡ Générer wallet POWCHAIN</button>
<div id="powWallet"></div>
</div>

<div class="panel"><h2>POWCHAIN — STATS</h2>
<div id="stats"></div>
<canvas id="chart" height="160"></canvas>
</div>

<div class="panel"><h2>BLOCS RÉCENTS</h2><div id="blocks"></div></div>

<div class="panel"><h2>RECHERCHE POWCHAIN</h2>
<input id="searchWallet" placeholder="Adresse POWCHAIN">
<button class="btn" onclick="searchW()">🔎 Rechercher wallet</button>
<div id="walletResult"></div><br>
<input id="searchTx" placeholder="ID / Hash TX POWCHAIN">
<button class="btn" onclick="searchT()">🔎 Rechercher TX</button>
<div id="txResult"></div>
</div>

<div class="panel"><h2>CONSOLE</h2><div id="console"></div></div>

<script>
/* ==== LOG ==== */
const log=t=>{const c=document.getElementById("console");c.textContent+="\n"+t;c.scrollTop=c.scrollHeight};

/* ==== SOLANA ==== */
let solConn=new solanaWeb3.Connection("https://api.mainnet-beta.solana.com");
let solPub=null;
async function connectPhantom(){
 try{
  if(!window.solana) return log("🔌 Phantom absent");
  const r=await window.solana.connect(); solPub=r.publicKey.toString();
  document.getElementById("solStatus").textContent="🟢 Phantom connecté : "+solPub;
  refreshSol();
 }catch(e){log("❌ Phantom : "+e)}
}
async function refreshSol(){
 try{
  if(!solPub) return;
  const sol=(await solConn.getBalance(new solanaWeb3.PublicKey(solPub)))/1e9;
  const tok=await solConn.getParsedTokenAccountsByOwner(new solanaWeb3.PublicKey(solPub),
    {programId:new solanaWeb3.PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA")});
  let usdc=0; for(const t of tok.value){
    if(t.account.data.parsed.info.mint==="EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1")
      usdc+=Number(t.account.data.parsed.info.tokenAmount.uiAmount);
  }
  document.getElementById("solBalances").textContent=`SOL: ${sol.toFixed(4)} | USDC: ${usdc.toFixed(2)}`;
 }catch(e){log("❌ Erreur soldes : "+e)}
}

/* ==== POWCHAIN WALLET ==== */
let pow=false;
function genPOW(){
 try{
  const k=document.getElementById("powPriv").value.trim();
  if(k===""){
    const kp=nacl.sign.keyPair(); pow={pub:bs58.encode(kp.publicKey),priv:bs58.encode(kp.secretKey),nonce:0};
    document.getElementById("powPriv").value=pow.priv;
  }else pow={pub:bs58.decode("x"),priv:k,nonce:0}; // validé prochain bloc WS
  document.getElementById("powWallet").textContent="🟢 POWCHAIN : "+pow.pub;
 }catch(e){log("❌ Wallet POWCHAIN : "+e)}
}

/* ==== WEBSOCKET POWCHAIN ==== */
let ws;
function wsConnect(){
 ws=new WebSocket("wss://bbqfinance.fun/ws");
 ws.onopen = ()=>log("🟢 WS connecté");
 ws.onclose= ()=>{log("WS fermé, reconnexion...");setTimeout(wsConnect,2000)}
 ws.onmessage = e=>{
  try{
    const m=JSON.parse(e.data);
    if(m.type==="chain") upd(m);
    if(m.type==="block") addBlock(m.block);
    if(m.type==="wallet" && m.pub) showWallet(m);
    if(m.type==="tx" && m.id) showTx(m);
  }catch{}
 }
}
wsConnect();

/* ==== UI UPDATE ==== */
function addBlock(b){
 const d=document.getElementById("blocks");
 d.innerHTML=`<div>Bloc ${b.height} — ${b.producer} — ${new Date(b.ts).toLocaleTimeString()}</div>`+d.innerHTML;
}
let chart=new Chart(document.getElementById("chart"),{
 type:"line",
 data:{labels:[],datasets:[
  {label:"Supply POW",borderColor:"#ff4444",data:[]},
  {label:"Supply LP",borderColor:"#ffcc44",data:[]},
  {label:"Prix POW (USDC POW)",borderColor:"#44ddff",data:[]}
 ]}
});
function upd(s){
 document.getElementById("stats").innerHTML=
 `Producteur: ${s.producer}<br>Supply POW: ${s.pow}<br>LP POW: ${s.lp}<br>Prix POW: ${s.price}<br>`;
 chart.data.labels.push(new Date().toLocaleTimeString());
 chart.data.datasets[0].data.push(s.pow);
 chart.data.datasets[1].data.push(s.lp);
 chart.data.datasets[2].data.push(s.price);
 if(chart.data.labels.length>20){chart.data.labels.shift(); chart.data.datasets.forEach(d=>d.data.shift())}
 chart.update();
}

/* ==== SEARCH ==== */
function searchW(){ws.send(JSON.stringify({type:"search_wallet",wallet:document.getElementById("searchWallet").value.trim()}))}
function showWallet(w){document.getElementById("walletResult").textContent=JSON.stringify(w,null,2)}
function searchT(){ws.send(JSON.stringify({type:"search_tx",id:document.getElementById("searchTx").value.trim()}))}
function showTx(t){document.getElementById("txResult").textContent=JSON.stringify(t,null,2)}
</script>
</body></html>
