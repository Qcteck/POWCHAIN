<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>BBQ Finance — POWCHAIN Hub</title><style>body{margin:0;background:#020b16;font-family:Arial;color:#bff}#wrap{max-width:1100px;margin:auto;padding:20px}button,input{border-radius:6px;border:1px solid #09f;background:#011422;color:#bff;padding:7px;margin:4px 0;font-size:14px}.card{border:1px solid #0af;background:#04101d;border-radius:10px;margin:9px 0;padding:12px}#log{background:#000;height:200px;overflow:auto;border:1px solid #035;padding:8px;font-size:12px;white-space:pre-wrap}</style></head><body><div id="wrap">
<h2>💠 BBQ Finance — Hub POWCHAIN + Solana</h2>

<div class="card">
<button onclick="connectPhantom()">🔗 Connecter Phantom</button>
<button onclick="refreshBalances()">🔄 Rafraîchir soldes Solana</button>
<div id="solanaAddr">Solana: -</div>
<div id="balSOL">SOL: -</div>
<div id="balUSDC">USDC: -</div>
</div>

<div class="card">
<button onclick="createWalletPOW()">🪙 Créer un wallet POWCHAIN</button>
<div id="powAddr">POWCHAIN: -</div>
<button onclick="copyAddr()">📋 Copier adresse</button><br>
<button onclick="togglePriv()">👁 Afficher/Masquer clé privée</button>
<button onclick="copyPriv()">📋 Copier clé privée</button>
<div id="privView" style="display:none"></div>
</div>

<div class="card">
<button onclick="refreshStats()">📊 Stats POWCHAIN</button>
<div id="powStats">-</div>
</div>

<div class="card">
<h3>⛓ POWCHAIN LIVE</h3>
<div id="log"></div>
</div>

</div><script>
const API="https://bbqfinance.fun";const WS="wss://bbqfinance.fun/ws";
function log(m){const e=document.getElementById("log");e.textContent+="\n"+new Date().toLocaleTimeString()+" | "+m;e.scrollTop=e.scrollHeight;}

let provider,solAddr;async function connectPhantom(){try{provider=window.solana;const r=await provider.connect();solAddr=r.publicKey.toString();document.getElementById("solanaAddr").textContent="Solana: "+solAddr;log("Phantom connecté 🟢");refreshBalances();}catch(e){log("Phantom refusé ❌")}}
async function refreshBalances(){if(!solAddr)return;try{const c=new solanaWeb3.Connection("https://lb.drpc.live/solana/Ah_pmhKMs0qntHMrHyHMTvqg8lcNcRkR8LWNEklbR4ac");const bal=await c.getBalance(new solanaWeb3.PublicKey(solAddr));document.getElementById("balSOL").textContent="SOL: "+(bal/1e9).toFixed(4);let usdc=0;const t=await c.getParsedTokenAccountsByOwner(new solanaWeb3.PublicKey(solAddr),{programId:new solanaWeb3.PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA")});t.value.forEach(i=>{const m=i.account.data.parsed.info.mint;if(m==="EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1")usdc+=i.account.data.parsed.info.tokenAmount.uiAmount});document.getElementById("balUSDC").textContent="USDC: "+usdc;}catch(e){log("Erreur SOL/USDC")}}

let powAddr="",powPriv="";function createWalletPOW(){const s=crypto.getRandomValues(new Uint8Array(32));powPriv=btoa(String.fromCharCode(...s));powAddr=btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(32)))).substring(0,44);document.getElementById("powAddr").textContent="POWCHAIN: "+powAddr;document.getElementById("privView").textContent=powPriv;log("Wallet POWCHAIN généré 🔥");}
function copyAddr(){navigator.clipboard.writeText(powAddr);log("Adresse copiée")}function togglePriv(){const e=document.getElementById("privView");e.style.display=e.style.display==="none"?"block":"none"}function copyPriv(){navigator.clipboard.writeText(powPriv);log("Clé privée copiée ⚠")}

async function refreshStats(){try{const j=await fetch(API+"/stats").then(r=>r.json());document.getElementById("powStats").textContent=JSON.stringify(j);log("Stats mises à jour")}catch(e){log("Erreur stats")}}

let ws;function wsStart(){ws=new WebSocket(WS);ws.onopen=()=>log("WS connecté 🟢");ws.onclose=()=>{log("WS fermé, reconnexion...");setTimeout(wsStart,3000)};ws.onerror=()=>log("Erreur WS");ws.onmessage=m=>log("MSG: "+m.data)}
wsStart();
</script>
<script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
</body></html>
