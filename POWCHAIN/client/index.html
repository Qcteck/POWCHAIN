<!doctype html><html lang="fr"><head><meta charset="utf-8"/><meta name="viewport"content="width=device-width,initial-scale=1"/><title>POWCHAIN — Validator Dashboard</title><style>body{margin:0;background:#05070b;color:#d5dade;font-family:system-ui;overflow:hidden}button,input{border-radius:6px;border:1px solid #444;background:#11151b;color:#e1e5ea;padding:6px;font-size:14px;margin:3px 0}#wrap{display:flex;height:100vh}#left{width:300px;border-right:1px solid #333;padding:10px;overflow-y:auto}#main{flex:1;position:relative;padding:10px}h2{text-align:center;margin:6px 0;color:#8ff;font-size:22px;text-shadow:0 0 6px #4ee}h3{margin:10px 0 5px;color:#9cd}#log{position:absolute;bottom:0;left:0;width:100%;height:200px;background:#0008;border-top:1px solid #333;color:#8ff;padding:6px;overflow:auto;font-size:13px;white-space:pre-wrap}</style></head><body><div id="wrap"><div id="left"><h2>POWCHAIN</h2><div>Solde POW: <span id="pow">0</span></div><div>Solde USDC POW: <span id="usdc">0</span></div><div>Staked: <span id="staked">0</span></div><h3>Actions</h3><button onclick="mine()">⛏️ Miner</button><br><input id="stakeAmt"placeholder="Montant stake POW"/><button onclick="stake()">Stake</button><br><input id="unstakeAmt"placeholder="Montant unstake POW"/><button onclick="unstake()">Unstake</button><br><h3>Transfert</h3><input id="toAddr"placeholder="Adresse destinataire"/><input id="amt"placeholder="Montant POW"/><button onclick="send()">Envoyer</button></div><div id="main"><h3>État du réseau</h3><div id="state"></div><div id="log"></div></div></div>
<script>
const API="https://bbqfinance.fun/stats";
const WS="wss://bbqfinance.fun/powchain/ws";
let ws;
function log(t){const L=document.getElementById("log");L.textContent+=t+"\n";L.scrollTop=L.scrollHeight;}
async function refreshStats(){
  try{
    const r=await fetch(API);
    const d=await r.json();
    document.getElementById("pow").textContent=d.wallet.pow;
    document.getElementById("usdc").textContent=d.wallet.usdc;
    document.getElementById("staked").textContent=d.wallet.staked;
    document.getElementById("state").textContent=`Blocs: ${d.blocks} | Validators: ${d.validators} | Mempool: ${d.mempool}`;
  }catch(e){log("❌ API stats indisponible");}
}
function connectWS(){
  ws=new WebSocket(WS);
  ws.onopen=()=>log("🔵 WebSocket connecté");
  ws.onclose=()=>{log("🟠 WebSocket fermé — reconnexion...");setTimeout(connectWS,1500);}
  ws.onerror=e=>log("❌ WS erreur");
  ws.onmessage=e=>log("📩 "+e.data);
}
async function action(type,obj){
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type,...obj})});
    const d=await r.json();
    log("➡️ "+d.msg);
  }catch(e){log("❌ action échouée");}
}
function mine(){action("mine",{});}
function stake(){action("stake",{amount:Number(stakeAmt.value)});}
function unstake(){action("unstake",{amount:Number(unstakeAmt.value)});}
function send(){action("send",{to:toAddr.value,amount:Number(amt.value)});}
setInterval(refreshStats,2000);
refreshStats();
connectWS();
</script></body></html>
